<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room Manager • ห้อง 1/2</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#697386;--line:#dce3ec;--p:#2563eb;--danger:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
[data-theme=dark]{--bg:#0f141c;--card:#151c26;--text:#edf2f7;--muted:#9aa7b8;--line:#2b3747;--p:#60a5fa}
[data-theme=gray]{--bg:#e9ecef;--card:#f8f9fa;--text:#20252b;--muted:#68717c;--line:#cfd5dc;--p:#475569}
[data-theme=white]{--bg:#fff;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--p:#111827}
*{scrollbar-width:thin}.hidden{display:none!important}.top{height:66px;position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{background:var(--p);color:#fff;border-radius:12px;padding:9px 10px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 66px)}aside{background:var(--card);border-right:1px solid var(--line);padding:14px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px;border-radius:10px;font-weight:700}.nav button.active,.nav button:hover{background:color-mix(in srgb,var(--p) 10%,var(--card));color:var(--text)}main{max-width:1250px;width:100%;margin:auto;padding:24px}.title{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:18px}.title h1{margin:0;font-size:27px}.title p{margin:5px 0 0;color:var(--muted)}.grid{display:grid;gap:14px}.cols{grid-template-columns:1.4fr 1fr}.stats{grid-template-columns:repeat(4,1fr)}.members{grid-template-columns:repeat(3,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px}.stat b{display:block;font-size:28px;margin-top:4px}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 12px;border-radius:10px;font-weight:750}.btn.primary{background:var(--p);color:#fff;border-color:var(--p)}.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}.list{display:grid;gap:8px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#dbeafe;color:#1d4ed8}.badge.ok{background:#dcfce7;color:#166534}.badge.bad{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px;align-items:center}.avatar{
  width:42px;
  height:42px;
  min-width:42px;
  max-width:42px;
  min-height:42px;
  max-height:42px;
  border-radius:50%;
  overflow:hidden;
  background:#dbeafe;
  display:grid;
  place-items:center;
  font-weight:800;
  flex:none
}
.avatar img{
  display:block;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  max-width:100%;
  max-height:100%;
  object-fit:cover;
  object-position:center;
  border:0;
  margin:0;
  padding:0
}
.profile-avatar{
  width:76px !important;
  height:76px !important;
  min-width:76px !important;
  min-height:76px !important;
  max-width:76px !important;
  max-height:76px !important;
}
.profile-avatar img{
  width:100% !important;
  height:100% !important;
  min-width:0 !important;
  min-height:0 !important;
  max-width:100% !important;
  max-height:100% !important;
  object-fit:cover !important;
  object-position:center
}.member{display:flex;gap:10px;align-items:center}.field{display:grid;gap:5px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}.form{display:grid;gap:12px}.form2{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}.chat{min-height:500px;display:grid;grid-template-rows:1fr auto}.messages{overflow:auto;display:grid;align-content:start;gap:8px}.bubble{max-width:75%;background:color-mix(in srgb,var(--p) 10%,var(--card));padding:9px 11px;border-radius:14px}.bubble.mine{margin-left:auto;background:var(--p);color:#fff}.chatform{display:flex;gap:8px;margin-top:10px}.chatform input{flex:1}.auth{min-height:100vh;display:grid;place-items:center;padding:18px}.authbox{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:25px}.tabs{display:flex;gap:6px;margin:16px 0}.tabs button{flex:1}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:50}.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.toast{position:fixed;right:15px;bottom:15px;background:var(--text);color:var(--card);padding:11px 14px;border-radius:11px;z-index:100}.colors{display:flex;gap:9px}.color{width:48px;height:36px;border-radius:10px;border:3px solid var(--line)}.color.active{border-color:var(--p)}.black{background:#111}.gray{background:#64748b}.white{background:#fff}.blue{background:#2563eb}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:17px 13px 82px}.stats{grid-template-columns:1fr 1fr}.cols,.members{grid-template-columns:1fr}.mobile{display:grid!important}.top{padding:0 13px}.brand span{display:none}}
.mobile{display:none;position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--card);border-top:1px solid var(--line);z-index:20;grid-template-columns:repeat(5,1fr)}.mobile button{border:0;background:none;color:var(--muted);font-size:11px}.mobile .active{color:var(--p);font-weight:800}
</style>
</head>
<body>
<div id="auth" class="auth">
<div class="authbox">
<div class="brand"><span class="logo">1/2</span><span>Room Manager</span></div>
<h1 id="authTitle">เข้าสู่ระบบ</h1><p class="muted">ระบบจัดการห้อง 1/2 • งานเวร • รายงาน • เงินห้อง • แชท</p>
<div class="tabs"><button class="btn primary" id="loginTab">เข้าสู่ระบบ</button><button class="btn" id="signupTab">สมัครสมาชิก</button></div>
<form id="authForm" class="form">
<div id="nameField" class="field hidden"><label>ชื่อที่แสดง</label><input id="name"></div>
<div class="field"><label>อีเมล</label><input id="email" type="email" required></div>
<div class="field"><label>รหัสผ่าน</label><input id="password" type="password" minlength="6" required></div>
<button class="btn primary" id="authBtn">เข้าสู่ระบบ</button>
</form>
<p id="setupNote" class="muted" style="font-size:12px;margin-top:15px"></p>
</div></div>

<div id="app" class="hidden">
<header class="top"><div class="brand"><span class="logo">1/2</span><span>Room Manager</span></div><div class="row"><button class="btn" onclick="loadAll()">↻</button><button class="btn" onclick="go('profile')" id="me"></button></div></header>
<div class="layout"><aside><div id="nav" class="nav"></div></aside><main id="main"></main></div>
<nav id="mobileNav" class="mobile"></nav></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="mt"></h2><button class="btn" onclick="closeModal()">×</button></div><div id="mb"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"><\/script>')}</script>
<script>
/* ใส่ค่าของ Supabase ของคุณตรงนี้ */
const SUPABASE_URL="https://djoyoeliscasgpwzvfpb.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_WWWw0HNtBhgcIDRgEM6dXA_a-SQ4ia-";
if(!window.supabase){
  $("setupNote").textContent="โหลดระบบเชื่อมต่อ Supabase ไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ หรือเปลี่ยนเครือข่ายอินเทอร์เน็ต";
  throw new Error("Supabase JS failed to load");
}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const roles={owner:"เจ้าของเว็บ",developer:"ผู้ช่วยพัฒนา",leader:"หัวหน้าห้อง",deputy:"รองหัวหน้า",student:"นักเรียน"};
const nav=[["home","⌂","ภาพรวม"],["tasks","✓","งานเวร"],["reports","⚑","รายงาน"],["money","฿","เงินห้อง"],["members","◎","รายชื่อ"],["chat","☁","แชท"],["profile","◉","โปรไฟล์"],["settings","⚙","ตั้งค่า"]];
let S={user:null,p:null,members:[],tasks:[],reports:[],payments:[],messages:[],view:"home",theme:localStorage.roomTheme||"blue",mode:"login"};

const $=x=>document.getElementById(x), esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const leader=()=>["owner","developer","leader","deputy"].includes(S.p?.role), owner=()=>["owner","developer"].includes(S.p?.role);
function toast(x){$("toast").textContent=x;$("toast").classList.remove("hidden");clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").classList.add("hidden"),2500)}
function avatar(p){return p?.avatar_url?`<img src="${esc(p.avatar_url)}">`:`<span>${esc((p?.display_name||"?").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase())}</span>`}
function date(x){return new Date(x).toLocaleString("th-TH",{dateStyle:"short",timeStyle:"short"})}
function theme(){document.documentElement.dataset.theme=S.theme;localStorage.roomTheme=S.theme}
function go(v){S.view=v;render()}
function modal(t,b){$("mt").textContent=t;$("mb").innerHTML=b;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden")}

function setMode(m){S.mode=m;$("nameField").classList.toggle("hidden",m!=="signup");$("authBtn").textContent=m==="signup"?"สร้างบัญชี":"เข้าสู่ระบบ";$("authTitle").textContent=m==="signup"?"สมัครสมาชิก":"เข้าสู่ระบบ";$("loginTab").classList.toggle("primary",m==="login");$("signupTab").classList.toggle("primary",m==="signup")}
$("loginTab").onclick=()=>setMode("login");$("signupTab").onclick=()=>setMode("signup");
$("authForm").onsubmit=async e=>{e.preventDefault();try{let r;if(S.mode==="signup"){r=await sb.auth.signUp({email:$("email").value,password:$("password").value,options:{data:{display_name:$("name").value||$("email").value.split("@")[0]}}})}else r=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(r.error)throw r.error;if(r.data.session)await start(r.data.session.user);else toast("สมัครแล้ว กรุณายืนยันอีเมลถ้าระบบร้องขอ")}catch(e){toast(e.message)}};

async function start(user){S.user=user;let r=await sb.from("profiles").select("*").eq("id",user.id).single();if(r.error){toast(r.error.message);return}S.p=r.data;theme();$("auth").classList.add("hidden");$("app").classList.remove("hidden");loadAll()}
async function loadAll(){if(!S.p)return;try{let q=await Promise.all([
sb.from("profiles").select("*").eq("room_id",S.p.room_id).order("number"),
sb.from("tasks").select("*,assigned:profiles!tasks_assigned_to_fkey(display_name,number)").eq("room_id",S.p.room_id).order("due_date"),
sb.from("reports").select("*,target:profiles!reports_target_id_fkey(display_name),reporter:profiles!reports_reporter_id_fkey(display_name)").eq("room_id",S.p.room_id).order("created_at",{ascending:false}).limit(100),
sb.from("payments").select("*,member:profiles!payments_member_id_fkey(display_name)").eq("room_id",S.p.room_id).order("week_start",{ascending:false}).limit(200),
sb.from("messages").select("*,sender:profiles!messages_sender_id_fkey(display_name,avatar_url)").eq("room_id",S.p.room_id).order("created_at").limit(300)
]);if(q.some(x=>x.error))throw q.find(x=>x.error).error;[S.members,S.tasks,S.reports,S.payments,S.messages]=q.map(x=>x.data||[]);render()}catch(e){toast("โหลดข้อมูลไม่สำเร็จ: "+e.message)}}

function navHtml(){let h=nav.map(x=>`<button class="${S.view===x[0]?"active":""}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join("");$("nav").innerHTML=h;$("mobileNav").innerHTML=nav.slice(0,5).map(x=>`<button class="${S.view===x[0]?"active":""}" onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join("")}
function page(t,s,c,a=""){return `<div class="title"><div><h1>${t}</h1><p>${s}</p></div>${a}</div>${c}`}
function taskList(a){if(!a.length)return `<p class="muted">ยังไม่มีงาน</p>`;return `<div class="list">${a.map(t=>`<div class="item"><div><b>${esc(t.title)}</b><div class="muted">${esc(t.assigned?.display_name||"ไม่ระบุ")} ${t.due_date?"• "+esc(t.due_date):""}</div></div><label><input type="checkbox" ${t.status==="done"?"checked":""} onchange="taskDone('${t.id}',this.checked)"> ${t.status==="done"?"เสร็จ":"รอทำ"}</label></div>`).join("")}</div>`}
function reportsList(a,actions=false){if(!a.length)return `<p class="muted">ยังไม่มีรายงาน</p>`;return `<div class="list">${a.map(r=>`<div class="item"><div><b>${esc(r.title)}</b><div class="muted">ผู้รายงาน ${esc(r.reporter?.display_name||"-")} • ${date(r.created_at)}</div>${r.target?.display_name?`<div class="muted">ผู้ถูกรายงาน: <b>${esc(r.target.display_name)}</b></div>`:""}</div><div class="row"><span class="badge ${r.status==="resolved"?"ok":"bad"}">${r.status==="resolved"?"จัดการแล้ว":"รอดำเนินการ"}</span>${actions&&leader()&&r.status!=="resolved"?`<button class="btn" onclick="resolve('${r.id}')">ปิด</button>`:""}</div></div>`).join("")}</div>`}

function render(){navHtml();$("me").innerHTML=avatar(S.p);let f={home:home,tasks:tasks,reports:reports,money:money,members:members,chat:chat,profile:profile,settings:settings}[S.view]||home;$("main").innerHTML=f();if(S.view==="chat"){let x=$("messages");x.scrollTop=x.scrollHeight;$("chatForm").onsubmit=sendMessage}}
function home(){let d=S.tasks.filter(x=>x.status==="done").length,p=S.reports.filter(x=>x.status==="open").length,paid=S.payments.filter(x=>x.status==="paid").length;return page("ภาพรวม","ระบบจัดการห้อง 1/2",`<div class="grid stats"><div class="card stat">สมาชิก<b>${S.members.length}</b></div><div class="card stat">งานเสร็จ<b>${d}/${S.tasks.length}</b></div><div class="card stat">รายงานค้าง<b>${p}</b></div><div class="card stat">รายการจ่ายแล้ว<b>${paid}</b></div></div><div class="grid cols" style="margin-top:14px"><section class="card"><h2>งานล่าสุด</h2>${taskList(S.tasks.slice(0,7))}</section><section class="card"><h2>รายงานล่าสุด</h2>${reportsList(S.reports.slice(0,5))}</section></div>`)}
function tasks(){return page("งานเวร","กวาดห้อง ถูพื้น ทิ้งขยะ และงานอื่น ๆ",leader()?'<button class="btn primary" onclick="addTask()">+ เพิ่มงาน</button>':"",`<div class="card">${taskList(S.tasks)}</div>`)}
function reports(){return page("รายงาน","บันทึกกรณีไม่ทำเวร/หนีเวร/ไม่กวาด/ไม่ถู/ไม่ทิ้งขยะ",`<div class="card"><div class="title"><h2>รายการรายงาน</h2><button class="btn primary" onclick="addReport()">+ แจ้งรายงาน</button></div>${reportsList(S.reports,true)}</div>`)}
function money(){let total=S.payments.reduce((a,x)=>a+Number(x.amount),0),paid=S.payments.filter(x=>x.status==="paid").reduce((a,x)=>a+Number(x.amount),0);return page("เงินห้อง","เก็บเงินรายสัปดาห์และดูประวัติ",leader()?'<button class="btn primary" onclick="addPayment()">+ บันทึกเงิน</button>':"",`<div class="grid stats"><div class="card stat">ทั้งหมด<b>฿${total.toLocaleString()}</b></div><div class="card stat">จ่ายแล้ว<b>฿${paid.toLocaleString()}</b></div><div class="card stat">ค้าง<b>฿${(total-paid).toLocaleString()}</b></div><div class="card stat">รายการ<b>${S.payments.length}</b></div></div><div class="card" style="margin-top:14px;overflow:auto"><table class="table"><tr><th>สมาชิก</th><th>สัปดาห์</th><th>เงิน</th><th>สถานะ</th></tr>${S.payments.map(p=>`<tr><td>${esc(p.member?.display_name||"-")}</td><td>${esc(p.week_start)}</td><td>฿${Number(p.amount).toLocaleString()}</td><td><span class="badge ${p.status==="paid"?"ok":"bad"}">${p.status==="paid"?"จ่ายแล้ว":"ค้าง"}</span></td></tr>`).join("")}</table></div>`)}
function members(){return page("รายชื่อ","สมาชิก ยศ และประวัติของแต่ละคน",`<div class="grid members">${S.members.map(p=>`<div class="card"><div class="member"><div class="avatar">${avatar(p)}</div><div><b>${esc(p.display_name)}</b><div class="muted">เลขที่ ${esc(p.number||"-")} • ${esc(roles[p.role])}</div></div></div><div class="row" style="margin-top:13px"><button class="btn" onclick="member('${p.id}')">ดูโปรไฟล์</button><button class="btn" onclick="go('chat')">แชท</button></div></div>`).join("")}</div>`)}
function chat(){return page("แชทห้อง","พูดคุยภายในห้อง",`<div class="card chat"><div id="messages" class="messages">${S.messages.map(m=>`<div class="bubble ${m.sender_id===S.user.id?"mine":""}"><b>${esc(m.sender?.display_name||"สมาชิก")}</b><div>${esc(m.body)}</div><small>${date(m.created_at)}</small></div>`).join("")||"<p class='muted'>ยังไม่มีข้อความ</p>"}</div><form id="chatForm" class="chatform"><input id="chatInput" class="field" maxlength="1000" placeholder="พิมพ์ข้อความ..."><button class="btn primary">ส่ง</button></form></div>`)}
function profile(){let h=S.reports.filter(x=>x.target_id===S.p.id);return page("โปรไฟล์ของฉัน","แก้ไขข้อมูลส่วนตัวและดูประวัติ",`<div class="grid cols"><div class="card"><div class="member"><div class="avatar" style="width:76px;height:76px">${avatar(S.p)}</div><div><h2>${esc(S.p.display_name)}</h2><div class="muted">เลขที่ ${esc(S.p.number||"-")} • ${roles[S.p.role]}</div></div></div><button class="btn primary" style="margin-top:15px" onclick="editProfile()">แก้ไขโปรไฟล์</button></div><div class="card"><h2>ประวัติการถูกรายงาน</h2>${reportsList(h)}</div></div>`)}
function settings(){return page("ตั้งค่า","หน้าตาและบัญชี",`<div class="grid cols"><div class="card"><h2>สี</h2><div class="colors"><button class="color black ${S.theme==="dark"?"active":""}" onclick="setTheme('dark')"></button><button class="color gray ${S.theme==="gray"?"active":""}" onclick="setTheme('gray')"></button><button class="color white ${S.theme==="white"?"active":""}" onclick="setTheme('white')"></button><button class="color blue ${S.theme==="blue"?"active":""}" onclick="setTheme('blue')"></button></div><p class="muted">ดำ • เทา • ขาว • ฟ้า/น้ำเงิน</p></div><div class="card"><h2>บัญชี</h2><p class="muted">${esc(S.user.email)}</p><button class="btn danger" onclick="logout()">ออกจากระบบ</button></div></div>`)}
async function taskDone(id,yes){let r=await sb.from("tasks").update({status:yes?"done":"open",completed_at:yes?new Date().toISOString():null}).eq("id",id);if(r.error)toast(r.error.message);else loadAll()}
function addTask(){modal("เพิ่มงาน",`<form id="f" class="form form2"><div class="field full"><label>ชื่องาน</label><input id="title" required placeholder="เช่น กวาดห้อง"></div><div class="field"><label>มอบหมาย</label><select id="who">${S.members.map(x=>`<option value="${x.id}">${esc(x.display_name)}</option>`)}</select></div><div class="field"><label>กำหนดวัน</label><input id="due" type="date"></div><div class="field full"><label>รายละเอียด</label><textarea id="desc"></textarea></div><button class="btn primary full">บันทึก</button></form>`);$("f").onsubmit=async e=>{e.preventDefault();let r=await sb.from("tasks").insert({room_id:S.p.room_id,title:$("title").value,description:$("desc").value,assigned_to:$("who").value,due_date:$("due").value||null,created_by:S.user.id});if(r.error)toast(r.error.message);else{closeModal();loadAll()}}}
function addReport(){modal("แจ้งรายงาน",`<form id="f" class="form"><div class="field"><label>ผู้ถูกรายงาน</label><select id="who"><option value="">ไม่ระบุ</option>${S.members.map(x=>`<option value="${x.id}">${esc(x.display_name)}</option>`)}</select></div><div class="field"><label>ประเภท</label><select id="type"><option>ไม่กวาดห้อง</option><option>ไม่ทำเวร</option><option>หนีเวร</option><option>ไม่ถูพื้น</option><option>ไม่ทิ้งขยะ</option><option>อื่น ๆ</option></select></div><div class="field"><label>หัวข้อ</label><input id="title" required></div><div class="field"><label>รายละเอียด</label><textarea id="desc"></textarea></div><button class="btn primary">ส่งรายงาน</button></form>`);$("f").onsubmit=async e=>{e.preventDefault();let r=await sb.from("reports").insert({room_id:S.p.room_id,reporter_id:S.user.id,target_id:$("who").value||null,type:$("type").value,title:$("title").value,description:$("desc").value});if(r.error)toast(r.error.message);else{closeModal();loadAll()}}}
async function resolve(id){let r=await sb.from("reports").update({status:"resolved",resolved_by:S.user.id,resolved_at:new Date().toISOString()}).eq("id",id);if(r.error)toast(r.error.message);else loadAll()}
function addPayment(){modal("บันทึกเงิน",`<form id="f" class="form form2"><div class="field"><label>สมาชิก</label><select id="who">${S.members.map(x=>`<option value="${x.id}">${esc(x.display_name)}</option>`)}</select></div><div class="field"><label>จำนวนเงิน</label><input id="amount" type="number" min="0" required></div><div class="field"><label>สัปดาห์เริ่ม</label><input id="week" type="date" required></div><div class="field"><label>สถานะ</label><select id="status"><option value="paid">จ่ายแล้ว</option><option value="unpaid">ค้างชำระ</option></select></div><button class="btn primary full">บันทึก</button></form>`);$("f").onsubmit=async e=>{e.preventDefault();let r=await sb.from("payments").insert({room_id:S.p.room_id,member_id:$("who").value,amount:Number($("amount").value),week_start:$("week").value,status:$("status").value,recorded_by:S.user.id});if(r.error)toast(r.error.message);else{closeModal();loadAll()}}}
function editProfile(){modal("แก้ไขโปรไฟล์",`<form id="f" class="form"><div class="field"><label>ชื่อ</label><input id="n" value="${esc(S.p.display_name)}" required></div><div class="field"><label>นามสกุล</label><input id="l" value="${esc(S.p.last_name||"")}"></div><div class="field"><label>เลขที่</label><input id="num" value="${esc(S.p.number||"")}" inputmode="numeric"></div><div class="field"><label>รูปโปรไฟล์จากแกลเลอรี</label><input id="photo" type="file" accept="image/*"></div><div id="preview" class="muted">เลือกรูปแล้วกดบันทึก</div><button class="btn primary">บันทึก</button></form>`);$("f").onsubmit=async e=>{e.preventDefault();let url=S.p.avatar_url,file=$("photo").files[0];if(file){let path=`${S.user.id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"")}`;let up=await sb.storage.from("avatars").upload(path,file,{upsert:true});if(up.error){toast(up.error.message);return}url=sb.storage.from("avatars").getPublicUrl(path).data.publicUrl}let r=await sb.from("profiles").update({display_name:$("n").value,last_name:$("l").value,number:$("num").value,avatar_url:url}).eq("id",S.user.id).select().single();if(r.error)toast(r.error.message);else{S.p=r.data;closeModal();render()}}}
function member(id){let p=S.members.find(x=>x.id===id),h=S.reports.filter(x=>x.target_id===id);modal("โปรไฟล์สมาชิก",`<div class="member"><div class="avatar" style="width:70px;height:70px">${avatar(p)}</div><div><h2>${esc(p.display_name)}</h2><div class="muted">เลขที่ ${esc(p.number||"-")} • ${roles[p.role]}</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><h3>ประวัติการถูกรายงาน (${h.length})</h3>${reportsList(h)}${owner()&&p.id!==S.user.id?`<button class="btn" onclick="role('${p.id}')">เปลี่ยนยศ</button>`:""}`)}
function role(id){let p=S.members.find(x=>x.id===id);modal("เปลี่ยนยศ",`<form id="f" class="form"><select id="r">${Object.entries(roles).map(([k,v])=>`<option value="${k}" ${p.role===k?"selected":""}>${v}</option>`).join("")}</select><button class="btn primary">บันทึก</button></form>`);$("f").onsubmit=async e=>{e.preventDefault();let r=await sb.from("profiles").update({role:$("r").value}).eq("id",id);if(r.error)toast(r.error.message);else{closeModal();loadAll()}}}
async function sendMessage(e){e.preventDefault();let v=$("chatInput").value.trim();if(!v)return;let r=await sb.from("messages").insert({room_id:S.p.room_id,sender_id:S.user.id,body:v});if(r.error)toast(r.error.message);else{$("chatInput").value="";loadAll()}}
function setTheme(x){S.theme=x;theme();render()}
async function logout(){await sb.auth.signOut();location.reload()}
(async()=>{theme();if(SUPABASE_URL.startsWith("YOUR_"))$("setupNote").textContent="ต้องใส่ SUPABASE_URL และ SUPABASE_ANON_KEY ก่อนใช้งานจริง";let r=await sb.auth.getSession();if(r.data.session)start(r.data.session.user);sb.auth.onAuthStateChange((_e,s)=>{if(s&&!S.user)start(s.user)})})();
</script>
</body></html>
