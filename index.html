<!doctype html>
<html lang="th">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>Room Manager • ห้อง 1/2</title>

<style>

:root{
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#697386;
  --line:#dce3ec;
  --p:#2563eb;
  --danger:#dc2626;
  --ok:#16a34a;
  --shadow:0 8px 24px rgba(15,23,42,.06);
}

*{
  box-sizing:border-box;
  scrollbar-width:thin;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
}

[data-theme=dark]{
  --bg:#0f141c;
  --card:#151c26;
  --text:#edf2f7;
  --muted:#9aa7b8;
  --line:#2b3747;
  --p:#60a5fa;
  --shadow:0 10px 30px rgba(0,0,0,.25);
}

[data-theme=gray]{
  --bg:#e9ecef;
  --card:#f8f9fa;
  --text:#20252b;
  --muted:#68717c;
  --line:#cfd5dc;
  --p:#475569;
}

[data-theme=white]{
  --bg:#fff;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --p:#111827;
}

[data-theme=blue]{
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#697386;
  --line:#dce3ec;
  --p:#2563eb;
}

[data-theme=pink]{
  --bg:#fff4f8;
  --card:#fff;
  --text:#3b1727;
  --muted:#8b6273;
  --line:#f3c9d9;
  --p:#ec4899;
  --danger:#e11d48;
  --ok:#16a34a;
  --shadow:0 10px 28px rgba(236,72,153,.10);
}

.hidden{
  display:none!important;
}

button,
.btn,
input,
select,
textarea,
.card,
.item,
.nav button,
.mobile button,
.color,
.avatar{
  transition:
    transform .16s ease,
    opacity .16s ease,
    box-shadow .16s ease,
    background-color .16s ease,
    border-color .16s ease,
    color .16s ease;
}

button,
.btn{
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
}

button:active,
.btn:active{
  transform:scale(.94);
}

button:disabled,
.btn:disabled{
  cursor:not-allowed;
  opacity:.55;
  transform:none!important;
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 14px rgba(37,99,235,.13);
}

.btn:active{
  transform:scale(.94) translateY(1px);
  box-shadow:none;
}

.card{
  animation:cardIn .28s ease both;
}

.card:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadow);
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(16px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(12px) scale(.96);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}


/* TOP */

.top{
  height:66px;
  position:sticky;
  top:0;
  z-index:10;
  background:color-mix(
    in srgb,
    var(--card) 92%,
    transparent
  );
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
}

.logo{
  background:var(--p);
  color:#fff;
  border-radius:12px;
  padding:9px 10px;
  box-shadow:0 5px 15px rgba(37,99,235,.2);
}


/* LAYOUT */

.layout{
  display:grid;
  grid-template-columns:220px 1fr;
  min-height:calc(100vh - 66px);
}

aside{
  background:var(--card);
  border-right:1px solid var(--line);
  padding:14px;
}

.nav{
  display:grid;
  gap:5px;
}

.nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  text-align:left;
  padding:11px;
  border-radius:10px;
  font-weight:700;
}

.nav button:hover{
  background:color-mix(
    in srgb,
    var(--p) 10%,
    var(--card)
  );
  color:var(--text);
  transform:translateX(3px);
}

.nav button.active{
  background:color-mix(
    in srgb,
    var(--p) 12%,
    var(--card)
  );
  color:var(--text);
}

main{
  max-width:1250px;
  width:100%;
  margin:auto;
  padding:24px;
}

.title{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:end;
  margin-bottom:18px;
}

.title h1{
  margin:0;
  font-size:27px;
}

.title p{
  margin:5px 0 0;
  color:var(--muted);
}

.grid{
  display:grid;
  gap:14px;
}

.cols{
  grid-template-columns:1.4fr 1fr;
}

.stats{
  grid-template-columns:repeat(4,1fr);
}

.members{
  grid-template-columns:repeat(3,1fr);
}


/* CARDS */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:17px;
}

.stat b{
  display:block;
  font-size:28px;
  margin-top:4px;
}

.muted{
  color:var(--muted);
}


/* BUTTONS */

.btn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:9px 12px;
  border-radius:10px;
  font-weight:750;
  min-height:40px;
}

.btn.primary{
  background:var(--p);
  color:#fff;
  border-color:var(--p);
}

.btn.danger{
  background:var(--danger);
  color:#fff;
  border-color:var(--danger);
}

.btn.small{
  min-height:32px;
  padding:6px 9px;
  font-size:12px;
}


/* LIST */

.list{
  display:grid;
  gap:8px;
}

.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px;
}

.item:hover{
  transform:translateX(2px);
  border-color:color-mix(
    in srgb,
    var(--p) 35%,
    var(--line)
  );
}

.badge{
  display:inline-block;
  border-radius:999px;
  padding:4px 8px;
  font-size:11px;
  font-weight:800;
  background:#dbeafe;
  color:#1d4ed8;
}

.badge.ok{
  background:#dcfce7;
  color:#166534;
}

.badge.bad{
  background:#fee2e2;
  color:#991b1b;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}


/* AVATAR */

.avatar{
  width:42px!important;
  height:42px!important;
  min-width:42px!important;
  max-width:42px!important;
  min-height:42px!important;
  max-height:42px!important;
  flex:0 0 42px!important;
  border-radius:50%;
  overflow:hidden;
  background:#dbeafe;
  display:grid;
  place-items:center;
  font-weight:800;
}

.avatar img{
  display:block!important;
  width:42px!important;
  height:42px!important;
  object-fit:cover!important;
  object-position:center!important;
}

.avatar.big{
  width:76px!important;
  height:76px!important;
  min-width:76px!important;
  max-width:76px!important;
  min-height:76px!important;
  max-height:76px!important;
  flex:0 0 76px!important;
}

.avatar.big img{
  width:76px!important;
  height:76px!important;
}

.member{
  display:flex;
  gap:10px;
  align-items:center;
}


/* FORM */

.field{
  display:grid;
  gap:5px;
}

.field label{
  font-size:13px;
  font-weight:700;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--card);
  color:var(--text);
  outline:none;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--p);
  box-shadow:
    0 0 0 3px
    color-mix(
      in srgb,
      var(--p) 15%,
      transparent
    );
}

.form{
  display:grid;
  gap:12px;
}

.form2{
  grid-template-columns:1fr 1fr;
}

.full{
  grid-column:1/-1;
}


/* TABLE */

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  text-align:left;
  padding:10px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.table-wrap{
  overflow:auto;
}


/* ==================================================
   CHAT — MINIMAL CLEAN
   ================================================== */

.chat{
  min-height:500px;
  display:grid;
  grid-template-rows:1fr auto;
  padding:14px;
}

.messages{
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:4px 2px 10px;
  scroll-behavior:smooth;
}

.bubble{
  width:fit-content;
  max-width:min(78%,520px);
  padding:9px 12px;
  border-radius:12px;

  background:color-mix(
    in srgb,
    var(--line) 35%,
    var(--card)
  );

  color:var(--text);

  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

  font-size:15px;
  font-weight:400;
  line-height:1.5;
  letter-spacing:0;

  word-break:break-word;
  overflow-wrap:anywhere;

  box-shadow:none;
}

.bubble.mine{
  margin-left:auto;
  background:var(--p);
  color:#fff;
}

.chatSender{
  display:block;
  margin:0 0 3px;
  font-size:12px;
  font-weight:600;
  line-height:1.3;
  color:var(--text);
  opacity:.65;
}

.bubble.mine .chatSender{
  color:#fff;
  opacity:.82;
}

.chatText{
  white-space:pre-wrap;
  overflow-wrap:anywhere;

  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

  font-size:15px;
  font-weight:400;
  line-height:1.5;
  letter-spacing:0;
}

.chatTime{
  display:block;
  margin-top:4px;
  font-size:10px;
  font-weight:400;
  line-height:1.2;
  color:var(--muted);
  opacity:.6;
}

.bubble.mine .chatTime{
  color:#fff;
  opacity:.7;
}

.chatActions{
  margin-top:6px;
  text-align:right;
}

.chatActions .btn{
  min-height:28px;
  padding:4px 8px;
  border-radius:8px;
  font-size:11px;
  font-weight:500;
  box-shadow:none;
}

.chatform{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:8px;
  padding-top:9px;
  border-top:1px solid var(--line);
}

.chatInput{
  flex:1;
  min-width:0;
  height:42px;
  padding:9px 13px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--card);
  color:var(--text);
  outline:none;

  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

  font-size:15px;
  font-weight:400;
  line-height:1.4;
  box-shadow:none;
}

.chatInput::placeholder{
  color:var(--muted);
  opacity:.7;
}

.chatInput:focus{
  border-color:var(--p);
  box-shadow:
    0 0 0 2px
    color-mix(
      in srgb,
      var(--p) 10%,
      transparent
    );
}

.chatform .btn.primary{
  height:42px;
  min-height:42px;
  padding:0 15px;
  border-radius:11px;

  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

  font-size:14px;
  font-weight:600;
  box-shadow:none;
}

.chatform .btn.primary:hover{
  transform:none;
  box-shadow:none;
}

@media(max-width:600px){

  .chat{
    min-height:calc(100vh - 180px);
    padding:11px;
    border-radius:14px;
  }

  .messages{
    gap:7px;
    padding:2px 0 8px;
  }

  .bubble{
    max-width:85%;
    padding:8px 11px;
    border-radius:12px;
    font-size:15px;
    line-height:1.5;
  }

  .chatText{
    font-size:15px;
    line-height:1.5;
  }

  .chatSender{
    font-size:12px;
    margin-bottom:2px;
  }

  .chatTime{
    font-size:10px;
    margin-top:4px;
  }

  .chatInput{
    height:40px;
    padding:8px 12px;
    border-radius:10px;
    font-size:15px;
  }

  .chatform .btn.primary{
    height:40px;
    min-height:40px;
    padding:0 13px;
    border-radius:10px;
    font-size:13px;
  }

}


/* AUTH */

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:18px;
}

.authbox{
  width:min(430px,100%);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:25px;
  box-shadow:var(--shadow);
  animation:cardIn .35s ease both;
}

.tabs{
  display:flex;
  gap:6px;
  margin:16px 0;
}

.tabs button{
  flex:1;
}


/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:grid;
  place-items:center;
  padding:18px;
  z-index:50;
}

.modalbox{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border-radius:18px;
  padding:18px;
  animation:modalIn .22s ease both;
  box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modalhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modalhead h2{
  margin:0;
}


/* TOAST */

.toast{
  position:fixed;
  right:15px;
  bottom:15px;
  background:var(--text);
  color:var(--card);
  padding:11px 14px;
  border-radius:11px;
  z-index:100;
  animation:toastIn .2s ease both;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}


/* COLORS */

.colors{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.color{
  width:48px;
  height:36px;
  border-radius:10px;
  border:3px solid var(--line);
  cursor:pointer;
}

.color.active{
  border-color:var(--p);
  box-shadow:
    0 0 0 3px
    color-mix(
      in srgb,
      var(--p) 15%,
      transparent
    );
}

.black{
  background:#111;
}

.gray{
  background:#64748b;
}

.white{
  background:#fff;
}

.blue{
  background:#2563eb;
}

.pink{
  background:#ec4899;
}


/* MOBILE */

@media(max-width:850px){

  .layout{
    grid-template-columns:1fr;
  }

  aside{
    display:none;
  }

  main{
    padding:17px 13px 82px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .cols,
  .members{
    grid-template-columns:1fr;
  }

  .mobile{
    display:flex!important;
  }

  .top{
    padding:0 13px;
  }

  .brand span{
    display:none;
  }

  .title{
    align-items:start;
  }

  .title h1{
    font-size:24px;
  }

  .item{
    align-items:flex-start;
  }

  .form2{
    grid-template-columns:1fr;
  }

}


/* ==================================================
   MOBILE NAV — ALL 8 ITEMS
   ================================================== */

.mobile{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  height:62px;

  background:var(--card);
  border-top:1px solid var(--line);

  z-index:20;

  overflow-x:auto;
  overflow-y:hidden;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;
}

.mobile::-webkit-scrollbar{
  display:none;
}

.mobile button{
  border:0;
  background:none;
  color:var(--muted);

  flex:0 0 72px;
  min-width:72px;

  height:62px;

  padding:5px 3px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:2px;

  white-space:nowrap;

  font-size:10px;
  line-height:1.2;
}

.mobile button:active{
  transform:scale(.94);
}

.mobile .active{
  color:var(--p);
  font-weight:800;
}

.mobileIcon{
  display:block;
  font-size:17px;
  line-height:1;
}

.mobileLabel{
  display:block;
  font-size:10px;
  line-height:1.2;
}

@media(max-width:420px){

  .mobile button{
    flex-basis:70px;
    min-width:70px;
  }

}

</style>
</head>

<div id="app" class="hidden">


<header class="top">

<div class="layout">

  <aside>

    <div

    </div>

  </aside>

  <main id="main">
  </main>

</div>


<nav
  id="mobileNav"

</nav>

</div>


<div
  id="modal"
  class="modal hidden">

  <div class="modalbox">

    <div class="modalhead">

      <h2 id="mt"></h2>

      <button
        class="btn"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <div id="mb"></div>

  </div>

</div>


<div
  id="toast"
  class="toast hidden">
</div>

/* =========================
TOAST
========================= */

function toast(x){

  $("toast").textContent=x;

  $("toast")
    .classList
    .remove("hidden");

  clearTimeout(
    window.tt
  );

  window.tt=setTimeout(
    ()=>{
      $("toast")
        .classList
        .add("hidden");
    },
    2500
  );

}


/* =========================
AVATAR
========================= */

function avatar(
  p,
  big=false
){

  const size =
    big ? 76 : 42;

  if(p?.avatar_url){

    return `

      <div
        class="avatar ${big?"big":""}">

        <img
          src="${esc(p.avatar_url)}"
          alt="รูปโปรไฟล์"
          width="${size}"
          height="${size}"
          loading="lazy">

      </div>

    `;

  }

  const initials =
    (p?.display_name||"?")
    .split(" ")
    .map(x=>x[0])
    .join("")
    .slice(0,2)
    .toUpperCase();

  return `

    <div
      class="avatar ${big?"big":""}">

      ${esc(initials)}

    </div>

  `;

}


/* =========================
DATE
========================= */

function date(x){

  return new Date(x)
    .toLocaleString(
      "th-TH",
      {
        dateStyle:"short",
        timeStyle:"short"
      }
    );

}


/* =========================
DATE HELPERS
========================= */

function localDateInput(
  d=new Date()
){

  const x=new Date(d);

  const y=x.getFullYear();

  const m=
    String(
      x.getMonth()+1
    ).padStart(2,"0");

  const day=
    String(
      x.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${day}`;

}


function weekStart(
  d=new Date()
){

  const x=new Date(d);

  const day=x.getDay();

  x.setDate(
    x.getDate()+
    (
      day===0
      ?-6
      :1-day
    )
  );

  return localDateInput(x);

}


function feeForWeek(
  week
){

  return Number(
    S.fees.find(
      x=>x.week_start===week
    )?.amount || 0
  );

}

/* =========================
AUTH
========================= */

$("authForm").onsubmit=
async e=>{

  e.preventDefault();

  const authButton=
    $("authBtn");

  authButton.disabled=true;

  const originalText=
    S.mode==="signup"
    ?"สร้างบัญชี"
    :"เข้าสู่ระบบ";

  authButton.textContent=
    "กำลังโหลด...";

  try{

    let r;

    if(S.mode==="signup"){

      r=
      await sb.auth.signUp({

        email:
          $("email").value,

        password:
          $("password").value,

        options:{
          data:{
            display_name:
              $("name").value ||
              $("email")
              .value
              .split("@")[0]
          }
        }

      });

    }else{

      r=
      await sb.auth
      .signInWithPassword({

        email:
          $("email").value,

        password:
          $("password").value

      });

    }

    if(r.error)
      throw r.error;

    if(r.data.session){

      await start(
        r.data.session.user
      );

    }else{

      toast(
        "สมัครแล้ว กรุณายืนยันอีเมลถ้าระบบร้องขอ"
      );

    }

  }catch(e){

    toast(e.message);

  }finally{

    authButton.disabled=false;

    authButton.textContent=
      originalText;

  }

};


/* =========================
START
========================= */

async function start(user){

  S.user=user;

  const r=
    await sb
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .single();

  if(r.error){

    toast(r.error.message);

    return;

  }

  S.p=r.data;

  theme();

  $("auth")
    .classList
    .add("hidden");

  $("app")
    .classList
    .remove("hidden");

  await loadAll();

}


/* =========================
LOAD ALL
========================= */

async function loadAll(){

  if(!S.p)
    return;

  try{

    const q=
      await Promise.all([

        sb
        .from("profiles")
        .select("*")
        .eq(
          "room_id",
          S.p.room_id
        )
        .order("number"),


        sb
        .from("tasks")
        .select(
          "*,assigned:profiles!tasks_assigned_to_fkey(display_name,number)"
        )
        .eq(
          "room_id",
          S.p.room_id
        )
        .order("due_date"),


        sb
        .from("reports")
        .select(
          "*,target:profiles!reports_target_id_fkey(display_name),reporter:profiles!reports_reporter_id_fkey(display_name)"
        )
        .eq(
          "room_id",
          S.p.room_id
        )
        .order(
          "created_at",
          {ascending:false}
        )
        .limit(100),


        sb
        .from("payments")
        .select(
          "*,member:profiles!payments_member_id_fkey(display_name)"
        )
        .eq(
          "room_id",
          S.p.room_id
        )
        .order(
          "week_start",
          {ascending:false}
        )
        .limit(200),


        sb
        .from("room_fees")
        .select("*")
        .eq(
          "room_id",
          S.p.room_id
        )
        .order(
          "week_start",
          {ascending:false}
        ),


        sb
        .from("messages")
        .select(
          "*,sender:profiles!messages_sender_id_fkey(display_name,avatar_url)"
        )
        .eq(
          "room_id",
          S.p.room_id
        )
        .order("created_at")
        .limit(300)

      ]);


    if(
      q.some(x=>x.error)
    ){

      throw q.find(
        x=>x.error
      ).error;

    }


    S.members=q[0].data||[];
    S.tasks=q[1].data||[];
    S.reports=q[2].data||[];
    S.payments=q[3].data||[];
    S.fees=q[4].data||[];
    S.messages=q[5].data||[];

    render();

  }catch(e){

    toast(
      "โหลดข้อมูลไม่สำเร็จ: "+
      e.message
    );

  }

}

/* =========================
TASK LIST
========================= */

function taskList(a){

  if(!a.length)
    return `
      <p class="muted">
        ยังไม่มีงาน
      </p>
    `;


  return `

    <div class="list">

      ${a.map(t=>`

        <div class="item">

          <div>

            <b>
              ${esc(t.title)}
            </b>

            <div class="muted">

              ${esc(
                t.assigned
                ?.display_name||
                "ไม่ระบุ"
              )}

              ${
                t.due_date
                ?" • "+esc(t.due_date)
                :""
              }

            </div>

          </div>

          <div class="row">

            <label>

              <input
                type="checkbox"
                ${
                  t.status==="done"
                  ?"checked"
                  :""
                }
                onchange="
                  taskDone(
                    '${t.id}',
                    this.checked
                  )
                ">

              ${
                t.status==="done"
                ?"เสร็จ"
                :"รอทำ"
              }

            </label>

            ${
              leader()
              ?
              `
                <button
                  type="button"
                  class="btn danger small"
                  onclick="
                    deleteTask('${t.id}')
                  ">
                  ลบ
                </button>
              `
              :""
            }

          </div>

        </div>

      `).join("")}

    </div>

  `;

}


/* =========================
REPORT LIST
========================= */

function reportsList(
  a,
  actions=false
){

  if(!a.length)
    return `
      <p class="muted">
        ยังไม่มีรายงาน
      </p>
    `;


  return `

    <div class="list">

      ${a.map(r=>`

        <div class="item">

          <div>

            <b>
              ${esc(r.title)}
            </b>

            <div class="muted">

              ผู้รายงาน
              ${esc(
                r.reporter
                ?.display_name||
                "-"
              )}

              •
              ${date(r.created_at)}

            </div>

            ${
              r.target?.display_name
              ?

              `
                <div class="muted">

                  ผู้ถูกรายงาน:
                  <b>
                    ${esc(
                      r.target.display_name
                    )}
                  </b>

                </div>
              `

              :""
            }

            ${
              r.description
              ?

              `
                <div
                  class="muted"
                  style="
                    margin-top:5px;
                    white-space:pre-wrap
                  ">

                  ${esc(
                    r.description
                  )}

                </div>
              `

              :""
            }

          </div>


          <div class="row">

            <span
              class="badge ${
                r.status==="resolved"
                ?"ok"
                :"bad"
              }">

              ${
                r.status==="resolved"
                ?"จัดการแล้ว"
                :"รอดำเนินการ"
              }

            </span>


            ${
              actions &&
              leader() &&
              r.status!=="resolved"

              ?

              `
                <button
                  class="btn small"
                  onclick="
                    resolve('${r.id}')
                  ">

                  ปิด

                </button>
              `

              :""
            }


            ${
              actions &&
              owner()

              ?

              `
                <button
                  class="btn danger small"
                  onclick="
                    deleteReport('${r.id}')
                  ">

                  ลบ

                </button>
              `

              :""
            }

          </div>

        </div>

      `).join("")}

    </div>

  `;

}

function setWeeklyFee(){

  }


  const current=
    weekStart();


  modal(

    "ตั้งค่าค่าห้อง",

    `

        id="feeForm"
        class="form">

        <div class="field">

          <label>
            สัปดาห์เริ่ม
          </label>

          <input
            id="feeWeek"
            type="date"
            value="${current}"
            required>

        </div>


        <div class="field">

          <label>
            ค่าห้องต่อคน
          </label>

          <input
            id="feeAmount"
            type="number"
            min="0"
            step="1"
            value="${feeForWeek(current)}"
            required>

        </div>


        <button
          class="btn primary">

          💾 บันทึกค่าห้อง

        </button>

      </form>

    $("feeAmount").value=
      feeForWeek(
        $("feeWeek").value
      );

  };


  $("feeForm").onsubmit=
  async e=>{

    e.preventDefault();

    const btn=e.submitter;

    btn.disabled=true;

    btn.textContent=
      "กำลังบันทึก...";


    try{

      const week=
        $("feeWeek").value;

      const amount=
        Number(
          $("feeAmount").value
        );

      const existing=
        S.fees.find(
          x=>x.week_start===week
        );


      let r;


      if(existing){

        r=
          await sb
          .from("room_fees")
          .update({

            amount,

            updated_at:
              new Date()
              .toISOString()

          })
          .eq(
            "id",
            existing.id
          );

      }else{

        r=
          await sb
          .from("room_fees")
          .insert({

            room_id:
              S.p.room_id,

            week_start:
              week,

            amount,

            created_by:
              S.user.id

      if(r.error)
        throw r.error;


      closeModal();

      toast(
        "✅ บันทึกค่าห้องแล้ว"

        e.message
      );

      btn.textContent=
        "💾 บันทึกค่าห้อง";

    }

  };

}

========================= */

function editProfile(){

  modal(

    "แก้ไขโปรไฟล์",

    `

      <form
        id="profileForm"
        class="form">

        <div class="field">

          <label>
            ชื่อ
          </label>

          <input
            id="n"
            value="${esc(
              S.p.display_name
            )}"
            required>

        </div>


        <div class="field">

          <label>
            นามสกุล
          </label>

          <input
            id="l"
            value="${esc(
              S.p.last_name||""
            )}">

        </div>


        <div class="field">

          <label>
            เลขที่
          </label>

          <input
            id="num"
            value="${esc(
              S.p.number||""
            )}"
            inputmode="numeric">

        </div>


        <div class="field">

          <label>
            รูปโปรไฟล์จากแกลเลอรี
          </label>

          <input
            id="photo"
            type="file"
            accept="image/*">

        </div>


        <p
          class="muted"
          style="font-size:12px">

          รูปจะถูกเก็บไว้ใน Supabase Storage

        </p>


        <button
          class="btn primary">

          💾 บันทึก

        </button>

      </form>

    `

  );


  $("profileForm").onsubmit=
  async e=>{

    e.preventDefault();

    const btn=e.submitter;

    btn.disabled=true;

    btn.textContent=
      "กำลังบันทึก...";


    try{

      let url=
        S.p.avatar_url;

      const file=
        $("photo")
        .files[0];


      if(file){

        const safeName=
          file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            ""
          );


        const path=
          `${S.user.id}/${Date.now()}-${safeName}`;


        const up=
          await sb
          .storage
          .from("avatars")
          .upload(
            path,
            file,
            {
              upsert:true
            }
          );


        if(up.error)
          throw up.error;


        url=
          sb
          .storage
          .from("avatars")
          .getPublicUrl(path)
          .data
          .publicUrl;

      }


      const r=
        await sb
        .from("profiles")
        .update({

          display_name:
            $("n").value,

          last_name:
            $("l").value,

          number:
            $("num").value,

          avatar_url:url

        })
        .eq(
          "id",
          S.user.id
        )
        .select()
        .single();


      if(r.error)
        throw r.error;


      S.p=r.data;

      closeModal();

      render();


    }catch(e){

      toast(
        "❌ "+
        e.message
      );

      btn.disabled=false;

      btn.textContent=
        "💾 บันทึก";

    }

  };

}

function role(id){

  if(!owner()){

    toast(
      "❌ เฉพาะ Owner เท่านั้น"
    );

    return;

  }


  const p=
    S.members.find(
      x=>x.id===id
    );


  if(!p){

    toast(
      "❌ ไม่พบสมาชิก"
    );

    return;

  }


  if(
    p.id===S.user.id
  ){

    toast(
      "❌ ไม่สามารถเปลี่ยนยศตัวเองได้"
    );

    return;

  }


  modal(

    "เปลี่ยนยศ",

    `

      <form
        id="roleForm"
        class="form">

        <div class="field">

          <label>
            สมาชิก
          </label>

          <input
            value="${esc(
              p.display_name
            )}"
            disabled>

        </div>


        <div class="field">

          <label>
            ยศปัจจุบัน
          </label>

          <input
            value="${esc(
              roles[p.role]||
              p.role||
              "-"
            )}"
            disabled>

        </div>


        <div class="field">

          <label>
            ยศใหม่
          </label>

          <select id="roleSelect">

            ${
              Object.entries(
                roles
              )
              .map(
                ([k,v])=>`

                  <option
                    value="${k}"
                    ${
                      p.role===k
                      ?"selected"
                      :""
                    }>

                    ${v}

                  </option>

                `
              )
              .join("")
            }

          </select>

        </div>


        <button
          id="roleSaveBtn"
          class="btn primary">

          💾 บันทึกยศ

        </button>

      </form>

    `

  );


  $("roleForm").onsubmit=
  async e=>{

    e.preventDefault();

    const newRole=
      $("roleSelect").value;

    const btn=
      $("roleSaveBtn");


    if(newRole===p.role){

      toast(
        "ยศยังเหมือนเดิม"
      );

      return;

    }


    btn.disabled=true;

    btn.textContent=
      "กำลังบันทึก...";


    try{

      const {
        data,
        error
      }=
        await sb.rpc(
          "change_member_role",
          {
            target_user_id:p.id,
            new_role:newRole
          }
        );


      if(error)
        throw error;


      if(data!==true){

        throw new Error(
          "ฐานข้อมูลไม่ได้ยืนยันการเปลี่ยนยศ"
        );

      }


      closeModal();

      toast(
        `✅ เปลี่ยน ${p.display_name} → ${roles[newRole]} สำเร็จ`
      );

      await loadAll();


    }catch(err){

      toast(
        "❌ "+
        err.message
      );

      btn.disabled=false;

/* =========================
CHANGE PASSWORD
========================= */

function changePassword(){

  if(!S.user){

    toast(
      "❌ ยังไม่ได้เข้าสู่ระบบ"
    );

    return;

  }


  modal(

    "เปลี่ยนรหัสผ่าน",

    `

      <form
        id="passwordForm"
        class="form">

        <div class="field">

          <label>
            รหัสผ่านใหม่
          </label>

          <input
            id="newPassword"
            type="password"
            minlength="6"
            autocomplete="new-password"
            required
            placeholder="อย่างน้อย 6 ตัวอักษร">

        </div>


        <div class="field">

          <label>
            ยืนยันรหัสผ่านใหม่
          </label>

          <input
            id="confirmPassword"
            type="password"
            minlength="6"
            autocomplete="new-password"
            required
            placeholder="กรอกรหัสผ่านอีกครั้ง">

        </div>


        <label
          class="row"
          style="
            cursor:pointer;
            user-select:none
          ">

          <input
            id="showPassword"
            type="checkbox">

          แสดงรหัสผ่าน

        </label>


        <p
          class="muted"
          style="font-size:12px">

          🔒 รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร

        </p>


        <button
          id="passwordSaveBtn"
          type="submit"
          class="btn primary">

          🔐 เปลี่ยนรหัสผ่าน

        </button>

      </form>

    `

  );


  $("showPassword").onchange=()=>{

    const type=
      $("showPassword").checked
      ?"text"
      :"password";


    $("newPassword").type=type;

    $("confirmPassword").type=type;

  };


  $("passwordForm").onsubmit=
  async e=>{

    e.preventDefault();


    const btn=
      $("passwordSaveBtn");


    const password=
      $("newPassword")
      .value;


    const confirm=
      $("confirmPassword")
      .value;


    if(password.length<6){

      toast(
        "❌ รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร"
      );

      return;

    }


    if(password!==confirm){

      toast(
        "❌ รหัสผ่านทั้งสองช่องไม่ตรงกัน"
      );

      return;

    }


    btn.disabled=true;

    btn.textContent=
      "กำลังเปลี่ยนรหัสผ่าน...";


    try{

      const {
        error
      }=
        await sb.auth.updateUser({

          password:password

        });


      if(error)
        throw error;


      closeModal();

      toast(
        "✅ เปลี่ยนรหัสผ่านสำเร็จ"
      );


    }catch(e){

      toast(
        "❌ เปลี่ยนรหัสผ่านไม่สำเร็จ: "+
        e.message
      );


      btn.disabled=false;

      btn.textContent=
        "🔐 เปลี่ยนรหัสผ่าน";

    }

  };

}

/* =========================
DELETE TASK
========================= */

async function deleteTask(id){

  if(!leader()){
    toast(
      "❌ ไม่มีสิทธิ์"
    );
    return;
  }

  const task=
    S.tasks.find(
      x=>x.id===id
    );

  if(!task){
    toast(
      "❌ ไม่พบงานนี้"
    );
    return;
  }

  if(!confirm(
    `ต้องการลบงาน "${String(task.title||"")}" ใช่หรือไม่?`
  )){
    return;
  }

  const r=
    await sb
    .from("tasks")
    .delete()
    .eq("id",id)
    .eq("room_id",S.p.room_id);

  if(r.error){
    toast(
      "❌ ลบงานไม่สำเร็จ: "+
      r.error.message
    );
    return;
  }

  toast(
    "✅ ลบงานแล้ว"
  );

  await loadAll();
}
