<!doctype html>
<html lang="th">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>Room Manager • ห้อง 1/2</title>

<style>

/* =========================================================
   ROOM MANAGER
   PART 1 — BASE / THEME / AUTH
   ========================================================= */

:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#697386;
  --line:#dce3ec;
  --p:#2563eb;
  --danger:#dc2626;
  --ok:#16a34a;
  --warning:#f59e0b;
  --shadow:0 10px 30px #17203312;

  --custom-bg:none;
  --custom-blur:0px;
}

[data-theme="dark"]{
  --bg:#0f141c;
  --card:#151c26;
  --text:#edf2f7;
  --muted:#9aa7b8;
  --line:#2b3747;
  --p:#60a5fa;
}

[data-theme="gray"]{
  --bg:#e9ecef;
  --card:#f8f9fa;
  --text:#20252b;
  --muted:#68717c;
  --line:#cfd5dc;
  --p:#475569;
}

[data-theme="white"]{
  --bg:#ffffff;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --p:#111827;
}

[data-theme="pink"]{
  --bg:#fff4f8;
  --card:#ffffff;
  --text:#351725;
  --muted:#866776;
  --line:#f0cad9;
  --p:#db2777;
}

*{
  box-sizing:border-box;
  scrollbar-width:thin;
}

html{
  min-height:100%;
}

body{
  margin:0;
  min-height:100vh;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* ---------------------------------------------------------
   CUSTOM BACKGROUND
   --------------------------------------------------------- */

body::before{
  content:"";
  position:fixed;
  inset:-35px;
  z-index:-1;
  pointer-events:none;

  background-image:var(--custom-bg);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  filter:blur(var(--custom-blur));
  opacity:.28;

  transform:scale(1.08);
  transition:
    filter .25s ease,
    opacity .25s ease,
    background-image .25s ease;
}

/* ---------------------------------------------------------
   GENERAL
   --------------------------------------------------------- */

.hidden{
  display:none!important;
}

.row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.grid{
  display:grid;
  gap:14px;
}

.cols{
  grid-template-columns:1.4fr 1fr;
}

.stats{
  grid-template-columns:repeat(4,1fr);
}

.members{
  grid-template-columns:repeat(3,1fr);
}

.card{
  background:color-mix(
    in srgb,
    var(--card) 96%,
    transparent
  );

  border:1px solid var(--line);
  border-radius:17px;
  padding:17px;

  box-shadow:var(--shadow);

  backdrop-filter:blur(10px);
}

.muted{
  color:var(--muted);
}

.notice{
  padding:12px;

  border:1px dashed var(--line);
  border-radius:12px;

  background:color-mix(
    in srgb,
    var(--p) 5%,
    var(--card)
  );
}

hr{
  border:0;
  border-top:1px solid var(--line);
}

/* ---------------------------------------------------------
   TOP BAR
   --------------------------------------------------------- */

.top{
  height:66px;

  position:sticky;
  top:0;
  z-index:10;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:color-mix(
    in srgb,
    var(--card) 92%,
    transparent
  );

  backdrop-filter:blur(14px);

  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;

  font-weight:800;
}

.logo{
  background:var(--p);
  color:#fff;

  border-radius:12px;

  padding:9px 10px;

  font-weight:900;
}

/* ---------------------------------------------------------
   LAYOUT
   --------------------------------------------------------- */

.layout{
  display:grid;

  grid-template-columns:220px 1fr;

  min-height:calc(100vh - 66px);
}

aside{
  background:color-mix(
    in srgb,
    var(--card) 94%,
    transparent
  );

  border-right:1px solid var(--line);

  padding:14px;
}

.nav{
  display:grid;
  gap:5px;
}

.nav button{
  border:0;

  background:transparent;

  color:var(--muted);

  text-align:left;

  padding:11px;

  border-radius:10px;

  font-weight:700;

  cursor:pointer;
}

.nav button.active,
.nav button:hover{
  background:color-mix(
    in srgb,
    var(--p) 10%,
    var(--card)
  );

  color:var(--text);
}

main{
  max-width:1250px;
  width:100%;

  margin:auto;

  padding:24px;
}

/* ---------------------------------------------------------
   PAGE TITLE
   --------------------------------------------------------- */

.title{
  display:flex;

  justify-content:space-between;
  align-items:end;

  gap:12px;

  margin-bottom:18px;
}

.title h1{
  margin:0;

  font-size:27px;
}

.title p{
  margin:5px 0 0;

  color:var(--muted);
}

/* ---------------------------------------------------------
   BUTTONS
   --------------------------------------------------------- */

.btn{
  border:1px solid var(--line);

  background:var(--card);
  color:var(--text);

  padding:9px 12px;

  border-radius:10px;

  font-weight:750;

  cursor:pointer;

  transition:
    transform .15s ease,
    opacity .15s ease,
    background .15s ease;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn:active{
  transform:translateY(0);
}

.btn.primary{
  background:var(--p);

  color:#fff;

  border-color:var(--p);
}

.btn.danger{
  background:var(--danger);

  color:#fff;

  border-color:var(--danger);
}

.btn.ok{
  background:var(--ok);

  color:#fff;

  border-color:var(--ok);
}

/* ---------------------------------------------------------
   FORMS
   --------------------------------------------------------- */

.form{
  display:grid;
  gap:12px;
}

.form2{
  grid-template-columns:1fr 1fr;
}

.full{
  grid-column:1/-1;
}

.field{
  display:grid;
  gap:5px;
}

.field label{
  font-size:13px;

  font-weight:700;
}

.field input,
.field select,
.field textarea{
  width:100%;

  padding:10px;

  border:1px solid var(--line);

  border-radius:10px;

  background:var(--card);
  color:var(--text);

  font:inherit;

  outline:none;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--p);

  box-shadow:
    0 0 0 3px
    color-mix(
      in srgb,
      var(--p) 12%,
      transparent
    );
}

/* ---------------------------------------------------------
   AUTH
   --------------------------------------------------------- */

.auth{
  min-height:100vh;

  display:grid;

  place-items:center;

  padding:18px;
}

.authbox{
  width:min(430px,100%);

  background:var(--card);

  border:1px solid var(--line);

  border-radius:20px;

  padding:25px;

  box-shadow:var(--shadow);

  backdrop-filter:blur(15px);
}

.authbox h1{
  margin-bottom:5px;
}

.authbox .brand{
  margin-bottom:15px;
}

.tabs{
  display:flex;

  gap:6px;

  margin:16px 0;
}

.tabs button{
  flex:1;
}

.auth-extra{
  display:grid;
  gap:8px;

  margin-top:10px;
}

/* ---------------------------------------------------------
   AVATAR
   --------------------------------------------------------- */

.avatar{
  width:42px;
  height:42px;

  min-width:42px;
  max-width:42px;

  min-height:42px;
  max-height:42px;

  border-radius:50%;

  overflow:hidden;

  background:#dbeafe;

  display:grid;
  place-items:center;

  font-weight:800;

  flex:none;
}

.avatar img{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center;

  border:0;
  margin:0;
  padding:0;
}

.profile-avatar{
  width:76px!important;
  height:76px!important;

  min-width:76px!important;
  min-height:76px!important;

  max-width:76px!important;
  max-height:76px!important;
}

/* ---------------------------------------------------------
   BADGES
   --------------------------------------------------------- */

.badge{
  display:inline-block;

  border-radius:999px;

  padding:4px 8px;

  font-size:11px;

  font-weight:800;

  background:#dbeafe;
  color:#1d4ed8;
}

.badge.ok{
  background:#dcfce7;
  color:#166534;
}

.badge.bad{
  background:#fee2e2;
  color:#991b1b;
}

.badge.warn{
  background:#fef3c7;
  color:#92400e;
}

/* ---------------------------------------------------------
   LISTS
   --------------------------------------------------------- */

.list{
  display:grid;
  gap:8px;
}

.item{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  border:1px solid var(--line);

  border-radius:12px;

  padding:11px;

  background:color-mix(
    in srgb,
    var(--card) 92%,
    transparent
  );
}

/* ---------------------------------------------------------
   STATISTICS
   --------------------------------------------------------- */

.stat b{
  display:block;

  font-size:28px;

  margin-top:4px;
}

/* ---------------------------------------------------------
   CHAT
   --------------------------------------------------------- */

.chat{
  min-height:500px;

  display:grid;

  grid-template-rows:1fr auto;
}

.messages{
  overflow:auto;

  display:grid;

  align-content:start;

  gap:8px;

  padding:4px;
}

.bubble{
  max-width:78%;

  background:color-mix(
    in srgb,
    var(--p) 10%,
    var(--card)
  );

  padding:9px 11px;

  border-radius:14px;
}

.bubble.mine{
  margin-left:auto;

  background:var(--p);

  color:#fff;
}

.bubble.cancelled{
  opacity:.72;

  font-style:italic;
}

.chatform{
  display:flex;

  gap:8px;

  margin-top:10px;
}

.chatform input{
  flex:1;
}

/* ---------------------------------------------------------
   MODAL
   --------------------------------------------------------- */

.modal{
  position:fixed;

  inset:0;

  background:#0008;

  display:grid;

  place-items:center;

  padding:18px;

  z-index:50;
}

.modalbox{
  width:min(700px,100%);

  max-height:90vh;

  overflow:auto;

  background:var(--card);

  border-radius:18px;

  padding:18px;

  box-shadow:
    0 25px 70px #0005;
}

.modalhead{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  margin-bottom:10px;
}

.modalhead h2{
  margin:0;
}

/* ---------------------------------------------------------
   TOAST
   --------------------------------------------------------- */

.toast{
  position:fixed;

  right:15px;
  bottom:15px;

  background:var(--text);
  color:var(--card);

  padding:11px 14px;

  border-radius:11px;

  z-index:100;

  max-width:min(90vw,500px);

  box-shadow:var(--shadow);
}

/* ---------------------------------------------------------
   NOTIFICATION
   --------------------------------------------------------- */

.iconbtn{
  position:relative;
}

.dot{
  position:absolute;

  right:3px;
  top:2px;

  min-width:17px;
  height:17px;

  border-radius:50%;

  background:var(--danger);

  color:#fff;

  font-size:10px;

  display:grid;
  place-items:center;

  padding:0 3px;
}

/* ---------------------------------------------------------
   THEME
   --------------------------------------------------------- */

.colors{
  display:flex;

  gap:9px;

  flex-wrap:wrap;
}

.color{
  width:48px;
  height:36px;

  border-radius:10px;

  border:3px solid var(--line);

  cursor:pointer;
}

.color.active{
  border-color:var(--p);
}

.black{
  background:#111;
}

.gray{
  background:#64748b;
}

.white{
  background:#fff;
}

.blue{
  background:#2563eb;
}

.pink{
  background:#db2777;
}

/* ---------------------------------------------------------
   CUSTOM THEME PREVIEW
   --------------------------------------------------------- */

.preview{
  height:170px;

  border-radius:14px;

  border:1px solid var(--line);

  background-size:cover;

  background-position:center;

  display:grid;

  place-items:center;

  overflow:hidden;

  position:relative;

  transition:
    filter .25s ease,
    background-image .25s ease;
}

.preview::after{
  content:"";

  position:absolute;

  inset:0;

  background:#0002;
}

.preview span{
  position:relative;

  z-index:1;

  background:#fffC;

  color:#111;

  padding:8px 12px;

  border-radius:10px;

  font-weight:800;
}

/* ---------------------------------------------------------
   VOICE
   --------------------------------------------------------- */

.voice{
  display:flex;

  align-items:center;

  gap:8px;
}

.voice audio{
  max-width:220px;
}

/* ---------------------------------------------------------
   MOBILE
   --------------------------------------------------------- */

.mobile{
  display:none;

  position:fixed;

  bottom:0;
  left:0;
  right:0;

  height:62px;

  background:var(--card);

  border-top:1px solid var(--line);

  z-index:20;

  grid-template-columns:repeat(5,1fr);
}

.mobile button{
  border:0;

  background:none;

  color:var(--muted);

  font-size:11px;

  cursor:pointer;
}

.mobile .active{
  color:var(--p);

  font-weight:800;
}

/* ---------------------------------------------------------
   RESPONSIVE
   --------------------------------------------------------- */

@media(max-width:850px){

  .layout{
    grid-template-columns:1fr;
  }

  aside{
    display:none;
  }

  main{
    padding:17px 13px 82px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .cols,
  .members{
    grid-template-columns:1fr;
  }

  .mobile{
    display:grid!important;
  }

  .top{
    padding:0 13px;
  }

  .brand span:not(.logo){
    display:none;
  }

  .title{
    align-items:start;
  }

  .form2{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}

@media(max-width:480px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .card{
    padding:14px;
  }

  .item{
    align-items:flex-start;
    flex-direction:column;
  }

  .item > .row{
    width:100%;
  }

  .bubble{
    max-width:90%;
  }

}

</style>
</head>

<body>

<!-- =========================================================
     AUTH SCREEN
     ========================================================= -->

<div id="auth" class="auth">

  <div class="authbox">

    <div class="brand">
      <span class="logo">1/2</span>
      <span>Room Manager</span>
    </div>

    <h1 id="authTitle">เข้าสู่ระบบ</h1>

    <p class="muted">
      ระบบจัดการห้อง 1/2 • งานเวร • รายงาน • เงินห้อง • แชท
    </p>

    <div class="tabs">

      <button
        class="btn primary"
        id="loginTab">
        เข้าสู่ระบบ
      </button>

      <button
        class="btn"
        id="signupTab">
        สมัครสมาชิก
      </button>

    </div>

    <form
      id="authForm"
      class="form">

      <div
        id="nameField"
        class="field hidden">

        <label>
          ชื่อที่แสดง
        </label>

        <input
          id="name"
          autocomplete="name">

      </div>

      <div class="field">

        <label>
          อีเมล
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          required>

      </div>

      <div class="field">

        <label>
          รหัสผ่าน
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          minlength="6"
          required>

      </div>

      <button
        class="btn primary"
        id="authBtn"
        type="submit">

        เข้าสู่ระบบ

      </button>

    </form>

    <!-- NEW: FORGOT PASSWORD -->

    <div class="auth-extra">

      <button
        class="btn"
        type="button"
        onclick="forgotPassword()">

        🔑 ลืมรหัสผ่าน

      </button>

    </div>

    <p
      id="setupNote"
      class="muted"
      style="font-size:12px;margin-top:15px">

    </p>

  </div>

</div>


<!-- =========================================================
     MAIN APP
     ========================================================= -->

<div id="app" class="hidden">

  <header class="top">

    <div class="brand">

      <span class="logo">
        1/2
      </span>

      <span>
        Room Manager
      </span>

    </div>

    <div class="row">

      <!-- NEW: NOTIFICATION -->

      <button
        class="btn iconbtn"
        onclick="notifications()"
        title="การแจ้งเตือน">

        🔔

        <span
          id="notifDot"
          class="dot hidden">

          0

        </span>

      </button>

      <button
        class="btn"
        onclick="loadAll()"
        title="รีเฟรช">

        ↻

      </button>

      <button
        class="btn"
        onclick="go('profile')"
        id="me">

      </button>

    </div>

  </header>


  <div class="layout">

    <aside>

      <div
        id="nav"
        class="nav">

      </div>

    </aside>


    <main id="main">

    </main>

  </div>


  <nav
    id="mobileNav"
    class="mobile">

  </nav>

</div>


<!-- =========================================================
     MODAL
     ========================================================= -->

<div
  id="modal"
  class="modal hidden">

  <div class="modalbox">

    <div class="modalhead">

      <h2 id="mt"></h2>

      <button
        class="btn"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <div id="mb"></div>

  </div>

</div>


<!-- =========================================================
     TOAST
     ========================================================= -->

<div
  id="toast"
  class="toast hidden">

</div>

<!-- =========================================================
     JAVASCRIPT — PART 1
     ========================================================= -->

<script>

const SUPABASE_URL =
  "https://djoyoeliscasgpwzvfpb.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_WWWw0HNtBhgcIDRgEM6dXA_a-SQ4ia-";


if(!window.supabase){

  const setupNote =
    document.getElementById("setupNote");

  if(setupNote){

    setupNote.textContent =
      "โหลดระบบเชื่อมต่อ Supabase ไม่สำเร็จ";

  }

  throw new Error(
    "Supabase JS failed"
  );

}


const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   ROLES
   ========================================================= */

const roles = {

  owner:
    "เจ้าของเว็บ",

  developer:
    "ผู้ช่วยพัฒนา",

  leader:
    "หัวหน้าห้อง",

  deputy:
    "รองหัวหน้า",

  treasurer:
    "เหรัญญิก",

  student:
    "นักเรียน"

};


/* =========================================================
   NAVIGATION
   ========================================================= */

const nav = [

  ["home","⌂","ภาพรวม"],

  ["tasks","✓","งานเวร"],

  ["reports","⚑","รายงาน"],

  ["money","฿","เงินห้อง"],

  ["members","◎","รายชื่อ"],

  ["chat","☁","แชท"],

  ["profile","◉","โปรไฟล์"],

  ["settings","⚙","ตั้งค่า"]

];


/* =========================================================
   GLOBAL STATE
   ========================================================= */

let S = {

  user:null,

  p:null,

  members:[],

  tasks:[],

  reports:[],

  payments:[],

  fees:[],

  messages:[],

  notifications:[],

  suggestions:[],

  view:"home",

  theme:
    localStorage.roomTheme ||
    "blue",

  mode:"login",

  customBg:
    localStorage.roomCustomBg ||
    "",

  customBlur:
    localStorage.roomCustomBlur ||
    "0px",

  privateWith:null,

  recording:false,

  mediaRecorder:null,

  audioChunks:[],

  recordingStartedAt:null

};


/* =========================================================
   HELPERS
   ========================================================= */

const $ = x =>
  document.getElementById(x);


const esc = x =>
  String(x ?? "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );


const leader = () =>
  [
    "owner",
    "developer",
    "leader",
    "deputy"
  ].includes(
    S.p?.role
  );


const owner = () =>
  [
    "owner",
    "developer"
  ].includes(
    S.p?.role
  );


const moneyManager = () =>
  [
    "owner",
    "treasurer"
  ].includes(
    S.p?.role
  );


function toast(message){

  const el =
    $("toast");

  if(!el)return;

  el.textContent =
    message;

  el.classList.remove(
    "hidden"
  );

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(
      () =>
        el.classList.add(
          "hidden"
        ),
      2800
    );

}


function date(value){

  if(!value)
    return "-";

  const d =
    new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  )
    return "-";

  return d.toLocaleString(
    "th-TH",
    {
      dateStyle:"short",
      timeStyle:"short"
    }
  );

}


function avatar(profile){

  if(profile?.avatar_url){

    return `
      <img
        src="${esc(profile.avatar_url)}"
        alt="">
    `;

  }

  const name =
    profile?.display_name ||
    "?";

  const initials =
    name
      .split(" ")
      .map(x => x[0])
      .join("")
      .slice(0,2)
      .toUpperCase();

  return `
    <span>
      ${esc(initials)}
    </span>
  `;

}


/* =========================================================
   THEME
   ========================================================= */

function theme(){

  document.documentElement
    .dataset.theme =
      S.theme;

  localStorage.roomTheme =
    S.theme;


  document.documentElement
    .style
    .setProperty(
      "--custom-bg",
      S.customBg
        ? `url("${S.customBg}")`
        : "none"
    );


  document.documentElement
    .style
    .setProperty(
      "--custom-blur",
      S.customBlur ||
      "0px"
    );

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function go(view){

  S.view =
    view;

  render();

}


/* =========================================================
   MODAL
   ========================================================= */

function modal(title,body){

  $("mt").textContent =
    title;

  $("mb").innerHTML =
    body;

  $("modal")
    .classList
    .remove("hidden");

}


function closeModal(){

  $("modal")
    .classList
    .add("hidden");

}


/* =========================================================
   AUTH MODE
   ========================================================= */

function setMode(mode){

  S.mode =
    mode;

  $("nameField")
    .classList
    .toggle(
      "hidden",
      mode !== "signup"
    );

  $("authBtn")
    .textContent =
      mode === "signup"
        ? "สร้างบัญชี"
        : "เข้าสู่ระบบ";

  $("authTitle")
    .textContent =
      mode === "signup"
        ? "สมัครสมาชิก"
        : "เข้าสู่ระบบ";

  $("loginTab")
    .classList
    .toggle(
      "primary",
      mode === "login"
    );

  $("signupTab")
    .classList
    .toggle(
      "primary",
      mode === "signup"
    );

}


$("loginTab").onclick =
  () =>
    setMode("login");


$("signupTab").onclick =
  () =>
    setMode("signup");


/* =========================================================
   LOGIN / SIGNUP
   ========================================================= */

$("authForm").onsubmit =
  async event => {

    event.preventDefault();

    try{

      let result;

      if(
        S.mode ===
        "signup"
      ){

        result =
          await sb.auth.signUp({

            email:
              $("email")
                .value
                .trim(),

            password:
              $("password")
                .value,

            options:{
              data:{
                display_name:
                  $("name")
                    .value
                    .trim() ||
                  $("email")
                    .value
                    .split("@")[0]
              }
            }

          });

      }else{

        result =
          await sb.auth
            .signInWithPassword({

              email:
                $("email")
                  .value
                  .trim(),

              password:
                $("password")
                  .value

            });

      }


      if(result.error)
        throw result.error;


      if(result.data.session){

        await start(
          result.data.session.user
        );

      }else{

        toast(
          "สมัครแล้ว กรุณายืนยันอีเมลถ้าระบบร้องขอ"
        );

      }

    }catch(error){

      toast(
        error?.message ||
        "เกิดข้อผิดพลาด"
      );

    }

  };


/* =========================================================
   FORGOT PASSWORD
   ========================================================= */

async function forgotPassword(){

  const email =
    (
      $("email")
        ?.value ||
      ""
    ).trim();


  if(!email){

    toast(
      "กรุณากรอกอีเมลก่อน"
    );

    $("email")?.focus();

    return;

  }


  try{

    const result =
      await sb.auth
        .resetPasswordForEmail(
          email,
          {
            redirectTo:
              location.origin +
              location.pathname
          }
        );


    if(result.error)
      throw result.error;


    toast(
      "ส่งลิงก์เปลี่ยนรหัสผ่านไปที่อีเมลแล้ว"
    );

  }catch(error){

    toast(
      error?.message ||
      "ไม่สามารถส่งลิงก์รีเซ็ตรหัสผ่านได้"
    );

  }

}


/* =========================================================
   START SESSION
   ========================================================= */

async function start(user){

  S.user =
    user;


  const result =
    await sb.from("profiles")
      .select("*")
      .eq("id",user.id)
      .single();


  if(result.error){

    toast(
      result.error.message
    );

    return;

  }


  S.p =
    result.data;


  theme();


  $("auth")
    .classList
    .add("hidden");


  $("app")
    .classList
    .remove("hidden");


  await loadAll();

}


/* =========================================================
   END PART 1
   ========================================================= */

/* =========================================================
   LOAD ALL DATA
   ========================================================= */

async function loadAll(){

  if(!S.user || !S.p)
    return;

  try{

    const roomId =
      S.p.room_id;


    /* -------------------------------------------------------
       PROFILES
       ------------------------------------------------------- */

    const membersResult =
      await sb
        .from("profiles")
        .select("*")
        .eq("room_id",roomId)
        .order(
          "display_name",
          {
            ascending:true
          }
        );

    if(membersResult.error)
      throw membersResult.error;

    S.members =
      membersResult.data || [];


    /* -------------------------------------------------------
       TASKS
       ------------------------------------------------------- */

    const tasksResult =
      await sb
        .from("tasks")
        .select(`
          *,
          assigned:profiles!tasks_assigned_to_fkey(
            id,
            display_name,
            avatar_url,
            role
          )
        `)
        .eq("room_id",roomId)
        .order(
          "created_at",
          {
            ascending:false
          }
        );

    if(tasksResult.error){

      /*
       * บางฐานข้อมูลอาจไม่มี foreign-key
       * ชื่อเดียวกับที่ query ด้านบนใช้
       * จึงลองโหลดแบบธรรมดาแทน
       */

      const fallback =
        await sb
          .from("tasks")
          .select("*")
          .eq("room_id",roomId)
          .order(
            "created_at",
            {
              ascending:false
            }
          );

      if(fallback.error)
        throw fallback.error;

      S.tasks =
        fallback.data || [];

    }else{

      S.tasks =
        tasksResult.data || [];

    }


    /* -------------------------------------------------------
       REPORTS
       ------------------------------------------------------- */

    const reportsResult =
      await sb
        .from("reports")
        .select(`
          *,
          target:profiles!reports_target_id_fkey(
            id,
            display_name,
            avatar_url,
            role
          ),
          reporter:profiles!reports_reporter_id_fkey(
            id,
            display_name,
            avatar_url,
            role
          )
        `)
        .eq("room_id",roomId)
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(reportsResult.error){

      const fallback =
        await sb
          .from("reports")
          .select("*")
          .eq("room_id",roomId)
          .order(
            "created_at",
            {
              ascending:false
            }
          );

      if(fallback.error)
        throw fallback.error;

      S.reports =
        fallback.data || [];

    }else{

      S.reports =
        reportsResult.data || [];

    }


    /* -------------------------------------------------------
       PAYMENTS
       ------------------------------------------------------- */

    const paymentsResult =
      await sb
        .from("payments")
        .select(`
          *,
          member:profiles!payments_member_id_fkey(
            id,
            display_name,
            avatar_url
          )
        `)
        .eq("room_id",roomId)
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(paymentsResult.error){

      const fallback =
        await sb
          .from("payments")
          .select("*")
          .eq("room_id",roomId)
          .order(
            "created_at",
            {
              ascending:false
            }
          );

      if(fallback.error)
        throw fallback.error;

      S.payments =
        fallback.data || [];

    }else{

      S.payments =
        paymentsResult.data || [];

    }


    /* -------------------------------------------------------
       ROOM FEES
       ------------------------------------------------------- */

    const feesResult =
      await sb
        .from("room_fees")
        .select("*")
        .eq("room_id",roomId)
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(feesResult.error){

      /*
       * ไม่ทำให้ทั้งเว็บพังถ้าตารางนี้ไม่มี
       */

      S.fees = [];

    }else{

      S.fees =
        feesResult.data || [];

    }


    /* -------------------------------------------------------
       GROUP MESSAGES
       ------------------------------------------------------- */

    const messagesResult =
      await sb
        .from("messages")
        .select(`
          *,
          sender:profiles!messages_sender_id_fkey(
            id,
            display_name,
            avatar_url,
            role
          )
        `)
        .eq("room_id",roomId)
        .order(
          "created_at",
          {
            ascending:true
          }
        );


    if(messagesResult.error){

      const fallback =
        await sb
          .from("messages")
          .select("*")
          .eq("room_id",roomId)
          .order(
            "created_at",
            {
              ascending:true
            }
          );

      if(fallback.error)
        throw fallback.error;

      S.messages =
        fallback.data || [];

    }else{

      S.messages =
        messagesResult.data || [];

    }


    /* -------------------------------------------------------
       NOTIFICATIONS
       ------------------------------------------------------- */

    const notificationsResult =
      await sb
        .from("notifications")
        .select("*")
        .eq("user_id",S.user.id)
        .order(
          "created_at",
          {
            ascending:false
          }
        )
        .limit(100);


    if(notificationsResult.error){

      /*
       * ตารางนี้เป็นฟีเจอร์ใหม่
       * ถ้ายังไม่ได้สร้าง จะไม่ทำให้เว็บเดิมพัง
       */

      S.notifications = [];

    }else{

      S.notifications =
        notificationsResult.data || [];

    }


    /* -------------------------------------------------------
       FEATURE SUGGESTIONS
       ------------------------------------------------------- */

    const suggestionQuery =
      owner()
        ? sb
            .from("feature_suggestions")
            .select("*")
            .eq("room_id",roomId)
            .order(
              "created_at",
              {
                ascending:false
              }
            )
        :
          sb
            .from("feature_suggestions")
            .select("*")
            .eq("room_id",roomId)
            .eq("user_id",S.user.id)
            .order(
              "created_at",
              {
                ascending:false
              }
            );


    const suggestionsResult =
      await suggestionQuery;


    if(suggestionsResult.error){

      S.suggestions = [];

    }else{

      S.suggestions =
        suggestionsResult.data || [];

    }


    updateHeader();

    buildNav();

    render();

  }catch(error){

    console.error(
      "loadAll:",
      error
    );

    toast(
      error?.message ||
      "โหลดข้อมูลไม่สำเร็จ"
    );

  }

}


/* =========================================================
   HEADER
   ========================================================= */

function updateHeader(){

  if(!S.p)
    return;


  const me =
    $("me");


  if(me){

    me.innerHTML = `

      <span class="row">

        <span class="avatar"
              style="width:30px;height:30px;min-width:30px">

          ${avatar(S.p)}

        </span>

        <span>
          ${esc(
            S.p.display_name ||
            "ผู้ใช้"
          )}
        </span>

      </span>

    `;

  }


  updateNotificationDot();

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function buildNav(){

  const el =
    $("nav");

  const mobile =
    $("mobileNav");


  if(!el)
    return;


  el.innerHTML =
    nav.map(item => {

      const [
        key,
        icon,
        label
      ] = item;


      return `

        <button
          class="${S.view === key ? "active" : ""}"
          onclick="go('${key}')">

          <span style="
            display:inline-block;
            width:25px
          ">
            ${icon}
          </span>

          ${label}

        </button>

      `;

    }).join("");


  if(mobile){

    const mobileItems = [

      ["home","⌂","หน้าแรก"],

      ["tasks","✓","งาน"],

      ["chat","☁","แชท"],

      ["members","◎","สมาชิก"],

      ["settings","⚙","ตั้งค่า"]

    ];


    mobile.innerHTML =
      mobileItems
        .map(item => {

          const [
            key,
            icon,
            label
          ] = item;


          return `

            <button
              class="${
                S.view === key
                  ? "active"
                  : ""
              }"
              onclick="go('${key}')">

              <div style="
                font-size:20px;
                line-height:22px
              ">
                ${icon}
              </div>

              ${label}

            </button>

          `;

        })
        .join("");

  }

}


/* =========================================================
   MAIN RENDER
   ========================================================= */

function render(){

  buildNav();


  const main =
    $("main");

  if(!main)
    return;


  switch(S.view){

    case "home":
      main.innerHTML =
        home();
      break;


    case "tasks":
      main.innerHTML =
        tasks();
      break;


    case "reports":
      main.innerHTML =
        reports();
      break;


    case "money":
      main.innerHTML =
        money();
      break;


    case "members":
      main.innerHTML =
        members();
      break;


    case "chat":
      main.innerHTML =
        chat();
      break;


    case "profile":
      main.innerHTML =
        profile();
      break;


    case "settings":
      main.innerHTML =
        settings();
      break;


    default:

      S.view =
        "home";

      main.innerHTML =
        home();

  }


  afterRender();

}


/* =========================================================
   AFTER RENDER

function afterRender(){

  /*

  if(S.view === "chat"){

    const box =
      document.querySelector(

    if(box){

        box.scrollHeight;

    }

  }


  /*
   * ใช้ธีมล่าสุดกับ preview

  applyCustomPreview();

}

/* =========================================================
   HOME TASKS
   ========================================================= */

              t.status === "done" ||

/* =========================================================
   FIND MEMBER
   ========================================================= */

function findMember(id){

  if(!id)
    return null;

  return S.members.find(
    m => m.id === id
  ) || null;

}


function findMemberName(id){

  return (
    findMember(id)
      ?.display_name ||
    ""
  );

}


/* =========================================================
   NOTIFICATION BADGE
   ========================================================= */

function updateNotificationDot(){

  const dot =
    $("notifDot");

  if(!dot)
    return;


  const count =
    S.notifications
      .filter(
        x => !x.read_at
      )
      .length;


  if(count > 0){

    dot.classList
      .remove("hidden");

    dot.textContent =
      count > 99
        ? "99+"
        : count;

  }else{

    dot.classList
      .add("hidden");

  }

}


/* =========================================================
   AUTH SESSION LISTENER
   ========================================================= */

sb.auth.onAuthStateChange(
  async (event,session) => {

    if(
      session?.user &&
      !S.user
    ){

      /*
       * หน่วงเล็กน้อยเพื่อไม่ให้ Supabase
       * เรียกซ้อนกับการโหลดหน้า
       */

      setTimeout(
        () =>
          start(session.user),
        0
      );

    }


    if(
      event ===
      "SIGNED_OUT"
    ){

      S.user =
        null;

      S.p =
        null;

      $("app")
        ?.classList
        .add("hidden");

      $("auth")
        ?.classList
        .remove("hidden");

    }

  }
);


/* =========================================================
   INITIAL SESSION
   ========================================================= */

(async function init(){

  try{

    const result =
      await sb.auth
        .getSession();


    if(result.error)
      throw result.error;


    if(result.data.session){

      await start(
        result.data.session.user
      );

    }else{

      $("auth")
        ?.classList
        .remove("hidden");

      $("app")
        ?.classList
        .add("hidden");

    }

  }catch(error){

    console.error(
      "init:",
      error
    );

    toast(
      "ไม่สามารถตรวจสอบเซสชันได้"
    );

  }

})();


/* =========================================================
   APPLY THEME NOW
   ========================================================= */

theme();


/* =========================================================
   END PART 2
   ========================================================= */

</script>

<script>

   ========================================================= */


/* =========================================================
   TASK PAGE
   ========================================================= */

/* =========================================================
   TASK LIST
   ========================================================= */

function taskList(){

  if(!S.tasks.length){

    return `

      <div class="notice">

        <b>
          ยังไม่มีงาน
        </b>

        <div
          class="muted"
          style="margin-top:4px">

          ${
            leader()
              ? "กด “เพิ่มงาน” เพื่อสร้างงานแรก"
              : "ตอนนี้ยังไม่มีงานที่ได้รับมอบหมาย"
          }

        </div>

      </div>

    `;

  }


  return S.tasks.map(task => {

    const done =
      task.completed === true ||
      task.status === "done" ||
      task.status === "completed";


    const assignedId =
      task.assigned_to ||
      task.user_id ||
      task.member_id;


    const assigned =

                  task.name ||

                )}
              </b>


              <span
                class="badge ${
                  done
                    ? "ok"
                    : "warn"
                }">

                ${
                  done
                    ? "เสร็จแล้ว"
                    : "กำลังดำเนินการ"
                }

              </span>

            </div>


            ${
              task.description
                ? `
                  <div
                    class="muted"
                    style="
                      margin-top:5px;
                      white-space:pre-wrap
                    ">

                    ${esc(
                      task.description
                    )}

                  </div>
                `

            }


            <div
              class="muted"
              style="
                margin-top:6px;

              ">

              👤 ${esc(assigned)}

              ${
                task.due_date
                  ? ` • 📅 ${esc(task.due_date)}`
                  : ""
              }

              ${
                task.created_at
                  ? ` • สร้าง ${date(task.created_at)}`
                  : ""
              }

            </div>

          </div>

        </div>


        <div class="row">

          ${
            assignedId === S.user?.id &&
            !done

                <button

                </button>
              `

          }


          ${
            done &&
            assignedId === S.user?.id

             * สำคัญ:
             * การลบงานเป็นคนละเรื่องกับการลบ "รายงาน"
             * และให้ Owner + Developer จัดการได้
             */
            owner()

/* =========================================================
   ADD TASK
   ========================================================= */

function addTask(){

  if(!leader()){

    toast(
      "คุณไม่มีสิทธิ์เพิ่มงาน"
    );

    return;

  }


  const memberOptions =
    S.members
      .map(m => `

        <option
          value="${esc(m.id)}">

          ${esc(
            m.display_name ||
            "ไม่มีชื่อ"
          )}

          ${
            m.role
              ? ` — ${esc(
                  roles[m.role] ||
                  m.role
                )}`
              : ""
          }

        </option>

      `)
      .join("");


  modal(
    "เพิ่มงานใหม่",
    `

      <form
        class="form"
        onsubmit="saveTask(event)">

        <div class="field">

          <label>
            ชื่องาน *
          </label>

          <input
            id="taskTitle"
            required
            maxlength="150"
            placeholder="เช่น กวาดห้อง">

        </div>


        <div class="field">

          <label>
            รายละเอียด
          </label>

          <textarea
            id="taskDescription"
            rows="4"
            maxlength="2000"
            placeholder="รายละเอียดเพิ่มเติม"></textarea>

        </div>


        <div class="field">

          <label>
            มอบหมายให้
          </label>

          <select
            id="taskAssignee">

            <option value="">
              — ยังไม่มอบหมาย —
            </option>

            ${memberOptions}

          </select>

        </div>


        <div class="field">

          <label>
            วันครบกำหนด
          </label>

          <input
            id="taskDue"
            type="date">

        </div>


        <div class="row"
             style="justify-content:flex-end">

          <button
            type="button"
            class="btn"
            onclick="closeModal()">

            ยกเลิก

          </button>


          <button
            type="submit"
            class="btn primary">

            💾 สร้างงาน

          </button>

        </div>

      </form>

    `
  );

}


/* =========================================================
   SAVE TASK
   ========================================================= */

async function saveTask(event){

  event.preventDefault();


  if(!leader()){

    toast(
      "คุณไม่มีสิทธิ์เพิ่มงาน"
    );

    return;

  }


  const title =
    $("taskTitle")
      ?.value
      .trim();


  const description =
    $("taskDescription")
      ?.value
      .trim() ||
    null;


  const assignedTo =
    $("taskAssignee")
      ?.value ||
    null;


  const dueDate =
    $("taskDue")
      ?.value ||
    null;


  if(!title){

    toast(
      "กรุณาระบุชื่องาน"
    );

    return;

  }


  try{

    const result =
      await sb
        .from("tasks")
        .insert({

          room_id:
            S.p.room_id,

          title:
            title,

          description:
            description,

          assigned_to:
            assignedTo,

          due_date:
            dueDate,

          completed:
            false

        })
        .select()
        .single();


    if(result.error)
      throw result.error;


    closeModal();


    toast(
      "สร้างงานเรียบร้อยแล้ว ✓"
    );


    /*
     * เพิ่ม notification ให้ผู้ที่ได้รับมอบหมาย
     */

    if(assignedTo){

      await createNotification({

        user_id:
          assignedTo,

        type:
          "task",

        title:
          "มีงานใหม่ที่ได้รับมอบหมาย",

        body:
          title,

        link:
          "tasks"

      });

    }


    await loadAll();

  }catch(error){

    console.error(
      "saveTask:",
      error
    );

    toast(
      error?.message ||
      "สร้างงานไม่สำเร็จ"
    );

  }

}


/* =========================================================
   COMPLETE TASK
   ========================================================= */

async function completeTask(id){

  const task =
    S.tasks.find(
      x => x.id === id
    );


  if(!task){

    toast(
      "ไม่พบงาน"
    );

    return;

  }


  const assignedId =
    task.assigned_to ||
    task.user_id ||
    task.member_id;


  if(
    assignedId !==
    S.user?.id
  ){

    toast(
      "คุณทำเครื่องหมายงานนี้ไม่ได้"
    );

    return;

  }


  try{

    const result =
      await sb
        .from("tasks")
        .update({

          completed:
            true,

          status:
            "done",

          completed_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          id
        )
        .eq(
          "room_id",
          S.p.room_id
        );


    if(result.error)
      throw result.error;


    toast(
      "ทำงานเสร็จแล้ว ✓"
    );


    /*
     * แจ้ง Owner/Developer/หัวหน้าห้อง
     */

    for(
      const member
      of S.members
    ){

      if(
        [
          "owner",
          "developer",
          "leader"
        ].includes(
          member.role
        ) &&
        member.id !== S.user.id
      ){

        await createNotification({

          user_id:
            member.id,

          type:
            "task_completed",

          title:
            "งานถูกทำเสร็จแล้ว",

          body:
            task.title ||
            task.name ||
            "งาน",

          link:
            "tasks"

        });

      }

    }


    await loadAll();

  }catch(error){

    console.error(
      "completeTask:",
      error
    );

    toast(
      error?.message ||
      "อัปเดตงานไม่สำเร็จ"
    );

  }

}


/* =========================================================
   REOPEN TASK
   ========================================================= */

async function reopenTask(id){

  const task =
    S.tasks.find(
      x => x.id === id
    );


  if(!task)
    return;


  const assignedId =
    task.assigned_to ||
    task.user_id ||
    task.member_id;


  if(
    assignedId !==
    S.user?.id
  ){

    toast(
      "คุณไม่มีสิทธิ์แก้งานนี้"
    );

    return;

  }


  try{

    const result =
      await sb
        .from("tasks")
        .update({

          completed:
            false,

          status:
            "pending",

          completed_at:
            null

        })
        .eq(
          "id",
          id
        )
        .eq(
          "room_id",
          S.p.room_id
        );


    if(result.error)
      throw result.error;


    toast(
      "เปิดงานอีกครั้งแล้ว"
    );


    await loadAll();

  }catch(error){

    toast(
      error?.message ||
      "ไม่สามารถเปิดงานอีกครั้งได้"
    );

  }

}


/* =========================================================
   DELETE TASK
   ========================================================= */

function deleteTask(id){

  if(!owner()){

    toast(
      "เฉพาะเจ้าของเว็บหรือผู้ช่วยพัฒนาเท่านั้น"
    );

    return;

  }


  const task =
    S.tasks.find(
      x => x.id === id
    );


  if(!task){

    toast(
      "ไม่พบงาน"
    );

    return;

  }


  modal(
    "ยืนยันการลบงาน",
    `

      <div class="notice">

        <b>
          ⚠️ ต้องการลบงานนี้หรือไม่?
        </b>

        <div
          class="muted"
          style="margin-top:6px">

          ${esc(
            task.title ||
            task.name ||
            "งานไม่มีชื่อ"
          )}

        </div>

        <div
          class="muted"
          style="
            margin-top:8px;
            font-size:12px
          ">

          การลบงานจะนำรายการงานนี้ออกจากระบบ
          และไม่ใช่การลบข้อมูลในหน้า “รายงาน”

        </div>

      </div>


      <div
        class="row"
        style="
          justify-content:flex-end;
          margin-top:14px
        ">

        <button
          class="btn"
          onclick="closeModal()">

          ยกเลิก

        </button>

        <button
          class="btn danger"
          onclick="confirmDeleteTask('${esc(id)}')">

          🗑️ ยืนยันลบงาน

        </button>

      </div>

    `
  );

}


/* =========================================================
   CONFIRM DELETE TASK
   ========================================================= */

async function confirmDeleteTask(id){

  if(!owner()){

    closeModal();

    toast(
      "คุณไม่มีสิทธิ์ลบงาน"
    );

    return;

  }


  try{

    const task =
      S.tasks.find(
        x => x.id === id
      );


    const result =
      await sb
        .from("tasks")
        .delete()
        .eq(
          "id",
          id
        )
        .eq(
          "room_id",
          S.p.room_id
        );


    if(result.error)
      throw result.error;


    closeModal();


    toast(
      "ลบงานเรียบร้อยแล้ว 🗑️"
    );


    /*
     * แจ้งคนที่เคยได้รับมอบหมาย
     */

    const assignedId =
      task?.assigned_to ||
      task?.user_id ||
      task?.member_id;


    if(assignedId){

      await createNotification({

        user_id:
          assignedId,

        type:
          "task_deleted",

        title:
          "งานถูกยกเลิก",

        body:
          task?.title ||
          task?.name ||
          "งาน",

        link:
          "tasks"

      });

    }


    await loadAll();

  }catch(error){

    console.error(
      "confirmDeleteTask:",
      error
    );

    toast(
      error?.message ||
      "ลบงานไม่สำเร็จ"
    );

  }

}


/* =========================================================
   TASK SEARCH / FILTER
   ========================================================= */

function filterTasks(){

  const input =
    $("taskSearch");


  if(!input)
    return;


  const q =
    input.value
      .trim()
      .toLowerCase();


  document
    .querySelectorAll(
      "[data-task-card]"
    )
    .forEach(card => {

      const text =
        card.textContent
          .toLowerCase();


      card.style.display =
        !q ||
        text.includes(q)
          ? ""
          : "none";

    });

}


/* =========================================================
   CREATE NOTIFICATION
   ========================================================= */

async function createNotification(data){

  if(!data?.user_id)
    return;


  try{

    const result =
      await sb
        .from("notifications")
        .insert({

          room_id:
            S.p?.room_id,

          user_id:
            data.user_id,

          type:
            data.type ||
            "system",

          title:
            data.title ||
            "การแจ้งเตือน",

          body:
            data.body ||
            "",

          link:
            data.link ||
            null

        });


    /*
     * ถ้ายังไม่มีตาราง notifications
     * จะไม่ทำให้ฟีเจอร์หลักพัง
     */

    if(result.error){

      console.warn(
        "notification:",
        result.error.message
      );

    }

  }catch(error){

    console.warn(
      "notification:",
      error
    );

  }

}


/* =========================================================
   END PART 3
   ========================================================= */

</script>

<script>

/* =========================================================
   PART 4 — REPORTS / ROOM MONEY
   ========================================================= */


/* =========================================================
   REPORTS PAGE

/* =========================================================
   REPORT LIST
   ========================================================= */

function reportsList(){

  if(!S.reports.length){

    return `

      <div class="notice muted">

        ยังไม่มีรายงาน

      </div>

    `;

  }


  return S.reports.map(report => {

    const resolved =
      report.status === "resolved" ||
      report.status === "closed";


    const target =
      report.target?.display_name ||
      report.target_name ||
      findMemberName(
        report.target_id
      ) ||
      "ไม่ระบุ";


    const reporter =
      report.reporter?.display_name ||
      report.reporter_name ||
      findMemberName(
        report.reporter_id
      ) ||
      "ไม่ระบุ";


    return `

      <div class="item">

        <div
          style="
            flex:1;
            min-width:0
          ">

          <div class="row">

            <b>
              ${esc(
                report.title ||
                report.subject ||
                "รายงาน"
              )}
            </b>


            <span
              class="badge ${
                resolved
                  ? "ok"
                  : "warn"
              }">

              ${
                resolved
                  ? "ดำเนินการแล้ว"
                  : "รอดำเนินการ"
              }

            </span>

          </div>


          ${
            report.body ||
            report.description ||
            report.message
              ? `
                <div
                  style="
                    margin-top:6px;
                    white-space:pre-wrap
                  ">

                  ${esc(
                    report.body ||
                    report.description ||
                    report.message
                  )}

                </div>
              `
              : ""
          }


          <div
            class="muted"
            style="
              font-size:12px;
              margin-top:6px
            ">

            👤 ผู้รายงาน:
            ${esc(reporter)}

            ${
              report.target_id
                ? ` • ผู้ถูกรายงาน: ${esc(target)}`
                : ""
            }

/* =========================================================

   ========================================================= */

async function saveReport(event){

  event.preventDefault();


  const title =
    $("reportTitle")
      ?.value
      .trim();


  const body =
    $("reportBody")
      ?.value
      .trim();


  const targetId =
    $("reportTarget")
      ?.value ||
    null;


  if(!title || !body){

    toast(
      "กรุณากรอกข้อมูลให้ครบ"
    );

    return;

  }


  try{

    const result =
      await sb
        .from("reports")
        .insert({

          room_id:
            S.p.room_id,

          reporter_id:
            S.user.id,

          target_id:
            targetId,

          title:
            title,

          body:
            body,

          status:
            "open"

        })
        .select()
        .single();


    if(result.error)
      throw result.error;


    closeModal();


    toast(
      "ส่งรายงานเรียบร้อยแล้ว ✓"
    );


    /*
     * แจ้งผู้ดูแล
     */

    for(
      const member
      of S.members
    ){

      if(
        [
          "owner",
          "developer",
          "leader",
          "deputy"
        ].includes(
          member.role
        ) &&
        member.id !== S.user.id
      ){

        await createNotification({

          user_id:
            member.id,

          type:
            "report",

          title:
            "มีรายงานใหม่",

          body:
            title,

          link:
            "reports"

        });

      }

    }


    await loadAll();

  }catch(error){

    console.error(
      "saveReport:",
      error
    );

    toast(
      error?.message ||
      "ส่งรายงานไม่สำเร็จ"
    );

  }

}

/* =========================================================
   MONEY FORMAT
   ========================================================= */

function formatMoney(value){

  const n =
    Number(value || 0);


  return n.toLocaleString(
    "th-TH",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  ) + " ฿";

}

async function savePayment(event){

  event.preventDefault();


  if(!moneyManager()){

    toast(
      "ไม่มีสิทธิ์"
    );

    return;

  }


  const title =
    $("paymentTitle")
      ?.value
      .trim();


  const amount =
    Number(
      $("paymentAmount")
        ?.value
    );


  const memberId =
    $("paymentMember")
      ?.value ||
    null;


  const type =
    $("paymentType")
      ?.value ||
    "income";


  const description =
    $("paymentDescription")
      ?.value
      .trim() ||
    null;


  if(
    !title ||
    !Number.isFinite(amount) ||
    amount < 0
  ){

    toast(
      "กรุณากรอกข้อมูลจำนวนเงินให้ถูกต้อง"
    );

    return;

  }


  try{

    const result =
      await sb
        .from("payments")
        .insert({

          room_id:
            S.p.room_id,

          member_id:
            memberId,

          amount:
            amount,

          type:
            type,

          title:
            title,

          description:
            description,

          created_by:
            S.user.id

        })
        .select()
        .single();


    if(result.error)
      throw result.error;


    closeModal();


    toast(
      "บันทึกรายการเงินแล้ว ✓"
    );


    if(memberId){

  }catch(error){

      "savePayment:",
      error
    );

    toast(
      error?.message ||
      "บันทึกรายการเงินไม่สำเร็จ"
    );

}

/* =========================================================
   MESSAGE 24-HOUR RULE
   ========================================================= */

function canCancelMessage(message){

  if(
    !message ||
    message.sender_id !==
      S.user?.id
  ){

    return false;

  }


  if(message.deleted_at)
    return false;


  if(!message.created_at)
    return false;


  const created =
    new Date(
      message.created_at
    ).getTime();


  if(!Number.isFinite(created))
    return false;


  const now =
    Date.now();


  const twentyFourHours =
    24 * 60 * 60 * 1000;


  return (
    now - created >= 0 &&
    now - created <=
      twentyFourHours
  );

}

async function confirmDeleteMessage(id){

/* =========================================================
   LOAD PRIVATE MESSAGES
   ========================================================= */

async function loadPrivateMessages(){

  if(
    !S.privateWith ||
    !S.user
  )
    return;


  try{

    const other =
      S.privateWith.id;


    const first =
      await sb
        .from("private_messages")
        .select("*")
        .eq(
          "room_id",
          S.p.room_id
        )
        .eq(
          "sender_id",
          S.user.id
        )
        .eq(
          "receiver_id",
          other
        )
        .order(
          "created_at",
          {
            ascending:true
          }
        );


    const second =
      await sb
        .from("private_messages")
        .select("*")
        .eq(
          "room_id",
          S.p.room_id
        )
        .eq(
          "sender_id",
          other
        )
        .eq(
          "receiver_id",
          S.user.id
        )
        .order(
          "created_at",
          {
            ascending:true
          }
        );


    if(first.error)
      throw first.error;


    if(second.error)
      throw second.error;


    S.privateMessages =
      [
        ...(first.data || []),
        ...(second.data || [])
      ]
      .sort(
        (a,b) =>
          new Date(a.created_at) -
          new Date(b.created_at)
      );

  }catch(error){

    console.warn(
      "private messages:",
      error
    );

    S.privateMessages =
      [];

  }

}

/* =========================================================
   VOICE RECORDER STATE
   ========================================================= */

let voiceRecorder =
  null;

let voiceChunks =
  [];

let voiceStartedAt =
  0;

let voiceTimer =
  null;

let voiceStream =
  null;


/* =========================================================
   START / STOP VOICE RECORDING
   ========================================================= */

async function toggleVoiceRecording(){

  if(
    voiceRecorder &&
    voiceRecorder.state ===
      "recording"
  ){

    stopVoiceRecording();

    return;

  }


  await startVoiceRecording();

}


/* =========================================================
   START VOICE RECORDING
   ========================================================= */

async function startVoiceRecording(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    toast(
      "เบราว์เซอร์ไม่รองรับการบันทึกเสียง"
    );

    return;

  }


  try{

    voiceStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio:true

        });


    voiceChunks =
      [];


    let options =
      {};


    /*
     * เลือก format ที่ browser รองรับ
     */

    const formats =
      [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/mp4",
        "audio/ogg;codecs=opus"
      ];


    for(
      const format
      of formats
    ){

      if(
        MediaRecorder
          .isTypeSupported(format)
      ){

        options.mimeType =
          format;

        break;

      }

    }


    voiceRecorder =
      new MediaRecorder(
        voiceStream,
        options
      );


    voiceRecorder.ondataavailable =
      event => {

        if(
          event.data &&
          event.data.size
        ){

          voiceChunks.push(
            event.data
          );

        }

      };


    voiceRecorder.onstop =
      async () => {

        clearInterval(
          voiceTimer
        );


        const duration =
          Math.max(
            1,
            Math.round(
              (
                Date.now() -
                voiceStartedAt
              ) / 1000
            )
          );


        const mime =
          voiceRecorder
            ?.mimeType ||
          "audio/webm";


        const blob =
          new Blob(
            voiceChunks,
            {
              type:mime
            }
          );


        cleanupVoiceStream();


        if(
          blob.size >
          0
        ){

          await finishVoiceRecording(
            blob,
            duration,
            mime
          );

        }

      };


    voiceRecorder.start(
      250
    );


    voiceStartedAt =
      Date.now();


    updateVoiceButton(
      true
    );


    voiceTimer =
      setInterval(
        updateVoiceDuration,
        250
      );


  }catch(error){

    console.error(
      "startVoiceRecording:",
      error
    );


    cleanupVoiceStream();


    toast(
      "ไม่สามารถเปิดไมโครโฟนได้ กรุณาอนุญาตการใช้ไมโครโฟน"
    );

  }

}


/* =========================================================
   STOP VOICE
   ========================================================= */

function stopVoiceRecording(){

  if(
    voiceRecorder &&
    voiceRecorder.state ===
      "recording"
  ){

    voiceRecorder.stop();

  }

}


/* =========================================================
   CLEANUP VOICE
   ========================================================= */

function cleanupVoiceStream(){

  if(voiceStream){

    voiceStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  voiceStream =
    null;


  voiceRecorder =
    null;


  voiceChunks =
    [];

}

/* =========================================================
   VOICE DURATION DISPLAY

function updateVoiceDuration(){

  if(

  )

  const seconds =

/* =========================================================
   FINISH VOICE RECORDING
   ========================================================= */

async function finishVoiceRecording(
  blob,
  duration,
  mime
){

  updateVoiceButton(

  );


  const privateChat =
    !!S.privateWith;


  /*
   * ถ้าเป็น private chat
   * ให้เตรียมส่งเข้า private_messages
   */

  if(privateChat){

    await uploadPrivateVoice(
      blob,
      duration,
      mime
    );

    return;

  }


  /*
   * ถ้าอยู่แชทกลุ่ม
   */

  await uploadGroupVoice(
    blob,
    duration,
    mime
  );

}


/* =========================================================
   UPLOAD GROUP VOICE
   ========================================================= */

async function uploadGroupVoice(
  blob,
  duration,
  mime
){

  if(!S.p?.room_id)
    return;


  const extension =
    mime.includes("mp4")
      ? "m4a"
      : mime.includes("ogg")
        ? "ogg"
        : "webm";


  const path =
    `${S.p.room_id}/${S.user.id}/${Date.now()}.${extension}`;


  try{

    const upload =
      await sb.storage
        .from("chat-audio")
        .upload(
          path,
          blob,
          {

            contentType:
              mime,

            upsert:false

          }
        );


    if(upload.error)
      throw upload.error;


    const publicUrl =
      sb.storage
        .from("chat-audio")
        .getPublicUrl(path)
        ?.data
        ?.publicUrl;


    /*
     * audio_path เก็บ path จริง
     * audio_url เป็น fallback หาก schema มี
     */

    const insertData = {

      room_id:
        S.p.room_id,

      sender_id:
        S.user.id,

      body:
        null,

      audio_path:
        path,

      audio_duration:
        duration

    };


    /*
     * ตาราง messages ต้องมี audio_path
     * และ audio_duration
     */

    const result =
      await sb
        .from("messages")
        .insert(
          insertData
        )
        .select()
        .single();


    if(result.error)
      throw result.error;


    await notifyEveryone({

      type:
        "message",

      title:
        "ข้อความเสียงใหม่",

      body:
        `${S.p.display_name || "สมาชิก"} ส่งข้อความเสียง ${formatDuration(duration)}`,

      link:
        "chat",

      exceptCurrent:
        true

    });


    toast(
      "ส่งข้อความเสียงแล้ว 🎙️"
    );


    await loadAll();

  }catch(error){

    console.error(
      "uploadGroupVoice:",
      error
    );


    /*
     * ถ้า upload สำเร็จแต่ insert ไม่สำเร็จ
     * พยายามลบไฟล์ที่อัปโหลดไว้
     */

    try{

      await sb.storage
        .from("chat-audio")
        .remove([
          path
        ]);

    }catch(_){}


    toast(
      error?.message ||
      "ส่งข้อความเสียงไม่สำเร็จ"
    );

  }

}

/* =========================================================
   FORMAT VOICE DURATION
   ========================================================= */

function formatDuration(
  seconds
){

  seconds =
    Math.max(
      0,
      Number(seconds) || 0
    );


  const min =
    Math.floor(
      seconds / 60
    );


  const sec =
    Math.floor(
      seconds % 60
    );


  return (
    String(min)
      .padStart(2,"0")
    +
    ":"
    +
    String(sec)
      .padStart(2,"0")
  );

}

/* =========================================================
   BLUR OPTION
   ========================================================= */

function blurOption(
  value,
  title,
  description
){

  const selected =
    String(
      S.customTheme.blur
    ) ===
    String(value);


  return `

    <button
      type="button"
      class="theme-btn ${selected ? "active" : ""}"
      onclick="setCustomBlur('${esc(value)}')">

      <b>
        ${esc(title)}
      </b>

      <small>
        ${esc(description)}
      </small>

    </button>

  `;

}


/* =========================================================
   BLUR LABEL
   ========================================================= */

function blurLabel(
  value
){

  switch(
    String(value)
  ){

    case "4":
      return "ต่ำ";

    case "8":
      return "สูง";

    default:
      return "ไม่มี";

  }

}


/* =========================================================
   SET BLUR — LIVE PREVIEW
   ========================================================= */

function setCustomBlur(
  value
){

  if(
    !["0","4","8"]
      .includes(
        String(value)
      )
  ){

    value = "0";

  }


  S.customTheme.blur =
    String(value);


  /*
   * เปลี่ยนทันทีโดยไม่ต้องกดบันทึก
   */

  applyCustomTheme();


  const preview =
    $("customBlurPreview");


  if(preview){

    preview.innerHTML = `

      ตัวอย่างระดับเบลอ:
      <b>
        ${blurLabel(value)}
      </b>

    `;

  }


  /*
   * อัปเดตปุ่มโดยไม่ต้อง render
   */

  document
    .querySelectorAll(
      ".theme-btn"
    )
    .forEach(
      button => {

        /*
         * ใช้ข้อความของปุ่มระบุสถานะ
         */

        button.classList
          .remove("active");

      }
    );


  const buttons =
    document
      .querySelectorAll(
        ".theme-btn"
      );


  buttons.forEach(
    button => {

      const onclick =
        button
          .getAttribute(
            "onclick"
          ) || "";


      if(
        onclick.includes(
          `'${value}'`
        )
      ){

        button.classList
          .add("active");

      }

    }
  );

}

function customBackgroundPreviewHTML(){

/* =========================================================
   SELECT BACKGROUND
   ========================================================= */

function previewCustomBackground(
  event
){

  const file =
    event.target
      ?.files?.[0];


  if(!file)
    return;


  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    toast(
      "กรุณาเลือกไฟล์รูปภาพ"
    );

    return;

  }


  /*
   * จำกัดขนาดก่อนสร้าง Data URL
   */

  if(
    file.size >
    8 * 1024 * 1024
  ){

    toast(
      "รูปใหญ่เกินไป กรุณาเลือกรูปไม่เกิน 8 MB"
    );

    event.target.value =
      "";

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(){

      S.customTheme
        .backgroundImage =
          reader.result;


      applyCustomTheme();


      const preview =
        $("customBackgroundPreview");


      if(preview){

        preview.innerHTML =
          customBackgroundPreviewHTML();

      }


      toast(
        "แสดงตัวอย่างพื้นหลังแล้ว ✓"
      );

    };


  reader.onerror =
    function(){

      toast(
        "ไม่สามารถอ่านรูปได้"
      );

    };


  reader.readAsDataURL(
    file
  );

}


/* =========================================================
   SAVE CUSTOM THEME
   ========================================================= */

function saveCustomTheme(){

  try{

    localStorage.setItem(
      "roomCustomBackground",
      S.customTheme
        .backgroundImage ||
        ""
    );


    localStorage.setItem(
      "roomCustomBlur",
      String(
        S.customTheme.blur ||
        "0"
      )
    );


    applyCustomTheme();


    toast(

    if(
      error?.name ===

/* =========================================================
   SAVE SUGGESTION
   ========================================================= */

async function saveSuggestion(){

  const title =
    $("suggestionTitle")
      ?.value
      .trim();


  const description =
    $("suggestionDescription")
      ?.value
      .trim();


  const category =
    $("suggestionCategory")
      ?.value ||
      "general";


  if(!title){

    toast(
      "กรุณาใส่ชื่อฟีเจอร์"
    );

    return;

  }


  if(title.length < 2){

    toast(
      "ชื่อฟีเจอร์สั้นเกินไป"
    );

    return;

  }


  try{

    const result =
      await sb
        .from(
          "feature_suggestions"
        )
        .insert({

          room_id:
            S.p.room_id,

          user_id:
            S.user.id,

          title:
            title,

          description:
            description ||
            null,

          category:
            category,

          status:
            "new"

        })
        .select()
        .single();


    if(result.error)
      throw result.error;


    /*
     * แจ้ง Owner + Developer
     */

    const admins =
      (S.members || [])
        .filter(
          member =>
            member.role ===
              "owner" ||
            member.role ===
              "developer"
        )
        .map(
          member =>
            member.id
        );


    await notifyUsers({

      userIds:
        admins,

      type:
        "suggestion",

      title:
        "มีข้อเสนอฟีเจอร์ใหม่ 💡",

      body:
        `${S.p.display_name || "สมาชิก"}: ${title}`,

      link:
        "suggestions"

    });


    closeModal();


    toast(
      "ส่งข้อเสนอแล้ว 💡"
    );


    await loadAll();


  }catch(error){

    console.error(
      "saveSuggestion:",
      error
    );


    toast(
      error?.message ||
      "ส่งข้อเสนอไม่สำเร็จ"
    );

  }

}


/* =========================================================
   UPDATE SUGGESTION STATUS
   ========================================================= */

async function updateSuggestionStatus(
  id,
  status
){

  if(!owner()){

    toast(
      "ไม่มีสิทธิ์แก้ไขข้อเสนอ"
    );

    return;

  }


  const allowed =
    [
      "new",
      "reviewing",
      "planned",
      "done",
      "rejected"
    ];


  if(
    !allowed.includes(
      status
    )
  ){

    return;

  }


  try{

    const result =
      await sb
        .from(
          "feature_suggestions"
        )
        .update({

          status:
            status

        })
        .eq(
          "id",
          id
        )
        .eq(
          "room_id",
          S.p.room_id
        );


    if(result.error)
      throw result.error;


    toast(
      "อัปเดตสถานะแล้ว ✓"
    );


    await loadAll();


  }catch(error){

    console.error(
      "updateSuggestionStatus:",
      error
    );


    toast(
      error?.message ||
      "อัปเดตไม่สำเร็จ"
    );

  }

}

/* =========================================================
   TASK DEADLINE NOTIFICATION
   ========================================================= */

async function checkTaskDeadlines(){

  if(!S.user)
    return;


  const now =
    Date.now();


  const tasks =
    S.tasks ||
    [];


  for(
    const task
    of tasks
  ){

    if(
      task.completed ||
      task.status ===
        "completed"
    ){

      continue;

    }


    if(
      task.assigned_to !==
      S.user.id
    ){

      continue;

    }


    if(!task.due_date)
      continue;


    const due =
      new Date(
        task.due_date
      ).getTime();


    if(
      !Number.isFinite(due)
    ){

      continue;

    }


    const hours =
      (
        due -
        now
      ) /
      (
        60 * 60 * 1000
      );


    /*
     * แจ้งเตือนเมื่อเหลือ <= 24 ชั่วโมง
     */

    if(
      hours > 0 &&
      hours <= 24
    ){

      const key =
        `taskDeadline_${task.id}_${new Date().toISOString().slice(0,10)}`;


      if(
        localStorage.getItem(
          key
        )
      ){

        continue;

      }


      localStorage.setItem(
        key,
        "1"
      );


      await createNotification({

        user_id:
          S.user.id,

        type:
          "deadline",

        title:
          "ใกล้ถึงกำหนดส่งงาน ⏰",

        body:
          task.title ||
          "มีงานใกล้ครบกำหนด",

        link:
          "tasks"

      });

    }

  }

}

/* =========================================================
   2. ESCAPE HTML
   ========================================================= */

function esc(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   3. DATE FORMAT FALLBACK
   ========================================================= */

if(
  typeof date !== "function"
){

  function date(value){

    if(!value)

    try{

      return new Date(
        value
      ).toLocaleString(
        "th-TH",
        {
          dateStyle:"medium",
          timeStyle:"short"
        }
      );

    }catch{

      return String(value);

    }

  }

/* =========================================================
   20. PRIVATE MESSAGE 24H LIMIT
   ========================================================= */

function canCancelPrivateMessage(
  message
){

  if(
    !message ||
    message.sender_id !==
      S.user?.id
  ){

    return false;

  }


  if(message.deleted_at)
    return false;


  const created =
    new Date(
      message.created_at
    ).getTime();


  if(!Number.isFinite(created))
    return false;


  return (
    Date.now() -
    created
  ) <=
  24 * 60 * 60 * 1000;

}

   ========================================================= */

async function saveProfile(){

  if(!S.user)
    return;

  try{

    const first =
      $("profileFirstName")?.value.trim() ||
      "";

    const last =
      $("profileLastName")?.value.trim() ||
      "";

    const number =
      $("profileNumber")?.value.trim() ||
      "";

    const display =
      (
        first +
        " " +
        last
      ).trim();

    const {
      data,
      error
    } =
      await sb
        .from("profiles")
        .update({

          first_name:
            first,

          last_name:
            last,

          student_number:
            number,

          display_name:
            display ||
            null

        })
        .eq(
          "id",
          S.user.id
        )
        .select()
        .single();

    if(error)
      throw error;

    S.p =
      {
        ...S.p,
        ...data
      };

    const index =
      (
        S.members ||
        []
      )
      .findIndex(
        m =>
          m.id ===
          S.user.id
      );

    if(index >= 0){

      S.members[index] =
        {
          ...S.members[index],
          ...data
        };

    }

    toast(
      "บันทึกโปรไฟล์แล้ว ✓"
    );

    render();

  }catch(error){

    console.error(
      "saveProfile:",
      error
    );

    toast(
      error?.message ||
      "บันทึกไม่สำเร็จ"
    );

  }

}

            schema:"public",

          },
