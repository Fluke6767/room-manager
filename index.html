function applyCustomTheme(){

  if(
    !S.customTheme ||
    typeof S.customTheme !== "object"
  ){
    return;
  }


  const root =
    document.documentElement;


  const background =
    S.customTheme.backgroundImage || "";


  let blur =
    Number(
      S.customTheme.blur || "0"
    );


  if(
    ![0,4,8].includes(blur)
  ){
    blur = 0;
  }


  let color =
    S.customTheme.color ||
    "#111827";


  /*
   * ป้องกันค่าที่ไม่ใช่สี
   */
  if(
    !/^#[0-9a-fA-F]{6}$/.test(color)
  ){

    color =
      "#111827";

  }


  root.style.setProperty(
    "--custom-bg-color",
    color
  );


  root.style.setProperty(
    "--custom-bg-blur",
    `${blur}px`
  );


  if(background){

    root.style.setProperty(
      "--custom-bg-image",
      `url("${background}")`
    );

    root.classList.add(
      "custom-background"
    );

  }else{

    root.style.setProperty(
      "--custom-bg-image",
      "none"
    );

    root.classList.remove(
      "custom-background"
    );

  }

}


/* =========================================================
   3. RUNTIME CUSTOM THEME CSS
   ========================================================= */

(function(){

  if(
    document.getElementById(
      "finalCustomThemeRuntime"
    )
  ){
    return;
  }


  const style =
    document.createElement(
      "style"
    );


  style.id =
    "finalCustomThemeRuntime";


  style.textContent = `

    html.custom-background{
      background:
        var(--custom-bg-color)
        !important;
    }

    html.custom-background::before{

      content:"";

      position:fixed;

      inset:0;

      z-index:-3;

      background-image:
        var(--custom-bg-image);

      background-size:cover;

      background-position:center;

      background-repeat:no-repeat;

      transform:scale(1.04);

      filter:
        blur(
          var(--custom-bg-blur)
        );

      pointer-events:none;

    }


    html.custom-background::after{

      content:"";

      position:fixed;

      inset:0;

      z-index:-2;

      background:
        var(--custom-bg-color);

      opacity:.18;

      pointer-events:none;

    }


    html.custom-background body{

      background:
        transparent !important;

    }


    html.custom-background .app{

      background:
        transparent !important;

    }

  `;


  document.head.appendChild(
    style
  );


  applyCustomTheme();

})();

/* =========================================================
   7. LIVE BLUR
   ========================================================= */

function setCustomBlur(value){

  value =
    String(value);


  if(
    !["0","4","8"].includes(value)
  ){
    value = "0";
  }


  S.customTheme.blur =
    value;


  applyCustomTheme();


  const preview =
    $("customBlurPreview");


  if(preview){

    preview.innerHTML = `

      ตัวอย่างระดับเบลอ:
      <b>
        ${blurLabel(value)}
      </b>

    `;

  }

}


/* =========================================================
   8. SAVE THEME
   ========================================================= */

function saveCustomThemeFinal(){

  try{

    localStorage.setItem(
      "roomCustomBackground",
      S.customTheme.backgroundImage ||
      ""
    );


    localStorage.setItem(
      "roomCustomBlur",
      String(
        S.customTheme.blur ||
        "0"
      )
    );


    localStorage.setItem(
      "roomCustomColor",
      S.customTheme.color ||
      "#111827"
    );


    applyCustomTheme();


    toast(
      "บันทึกธีมแล้ว ✓"
    );


  }catch(error){

    console.error(
      "saveCustomThemeFinal:",
      error
    );


    toast(
      "บันทึกธีมไม่สำเร็จ"
    );

  }

}

  S.customTheme = {

    backgroundImage:"",
    blur:"0",
    color:"#111827"

  };


  localStorage.removeItem(
    "roomCustomBackground"
  );


  localStorage.removeItem(
    "roomCustomBlur"
  );

    "roomCustomColor"
  );


  applyCustomTheme();


  closeModal();


  toast(
    "รีเซ็ตธีมแล้ว ✓"
  );


  render();

}

/* =========================================================
   11. FINAL RENDER
   ========================================================= */

const previousAfterRender =
  typeof afterRender ===
  "function"
    ? afterRender
    : function(){};


window.render =
function render(){

  buildNav();


  const main =
    $("main");


  if(!main){
    return;
  }


  switch(
    S.view
  ){

    case "home":

      main.innerHTML =
        home();

      break;


    case "tasks":

      main.innerHTML =
        tasks();

      break;


    case "reports":

      main.innerHTML =
        reports();

      break;


    case "money":

      main.innerHTML =
        money();

      break;


    case "members":

      main.innerHTML =
        members();

      break;


    case "chat":

      main.innerHTML =
        chat();

      break;


    case "profile":

      main.innerHTML =
        window.profile();

      break;


    case "settings":

      main.innerHTML =
        settings();

      break;


    case "notifications":

      main.innerHTML =
        notifications();

      break;


    case "suggestions":

      main.innerHTML =
        suggestions();

      break;


    case "custom-theme":

      main.innerHTML =
        customThemePage();

      break;


    case "announcements":

      main.innerHTML =
        announcements();

      break;


    default:

      S.view =
        "home";

      main.innerHTML =
        home();

  }


  previousAfterRender();

};


/* =========================================================
   12. FINAL NAVIGATION
   ========================================================= */

window.go =
function go(page){

  const validPages = [

    "home",
    "tasks",
    "reports",
    "money",
    "members",
    "chat",
    "profile",
    "settings",
    "notifications",
    "suggestions",
    "custom-theme",
    "announcements"

  ];


  if(
    !validPages.includes(page)
  ){

    page =
      "home";

  }


  S.view =
    page;


  render();


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

};
