<!doctype html>

<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room Manager • ห้อง 1/2</title><style>
:root{
  --bg:#f4f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#697386;
  --line:#dce3ec;
  --p:#2563eb;
  --danger:#dc2626;
  --ok:#16a34a;
  --shadow:0 8px 24px rgba(15,23,42,.06);
}

*{
  box-sizing:border-box;
  scrollbar-width:thin;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
}

[data-theme=dark]{
  --bg:#0f141c;
  --card:#151c26;
  --text:#edf2f7;
  --muted:#9aa7b8;
  --line:#2b3747;
  --p:#60a5fa;
  --shadow:0 10px 30px rgba(0,0,0,.25);
}

[data-theme=gray]{
  --bg:#e9ecef;
  --card:#f8f9fa;
  --text:#20252b;
  --muted:#68717c;
  --line:#cfd5dc;
  --p:#475569;
}

[data-theme=white]{
  --bg:#fff;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --p:#111827;
}

.hidden{
  display:none!important;
}

/* =========================
   GLOBAL ANIMATION
========================= */

button,
.btn,
input,
select,
textarea,
.card,
.item,
.nav button,
.mobile button,
.color,
.avatar{
  transition:
    transform .16s ease,
    opacity .16s ease,
    box-shadow .16s ease,
    background-color .16s ease,
    border-color .16s ease,
    color .16s ease;
}

button,
.btn{
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
}

button:active,
.btn:active{
  transform:scale(.94);
}

button:disabled,
.btn:disabled{
  cursor:not-allowed;
  opacity:.55;
  transform:none!important;
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 14px rgba(37,99,235,.13);
}

.btn:active{
  transform:scale(.94) translateY(1px);
  box-shadow:none;
}

.card{
  animation:cardIn .28s ease both;
}

.card:hover{
  transform:translateY(-1px);
  box-shadow:var(--shadow);
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(16px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(12px) scale(.96);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.04)}
}

/* =========================
   TOP
========================= */

.top{
  height:66px;
  position:sticky;
  top:0;
  z-index:10;
  background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
}

.logo{
  background:var(--p);
  color:#fff;
  border-radius:12px;
  padding:9px 10px;
  box-shadow:0 5px 15px rgba(37,99,235,.2);
}

.logo:active{
  transform:scale(.9) rotate(-3deg);
}

/* =========================
   LAYOUT
========================= */

.layout{
  display:grid;
  grid-template-columns:220px 1fr;
  min-height:calc(100vh - 66px);
}

aside{
  background:var(--card);
  border-right:1px solid var(--line);
  padding:14px;
}

.nav{
  display:grid;
  gap:5px;
}

.nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  text-align:left;
  padding:11px;
  border-radius:10px;
  font-weight:700;
}

.nav button:hover{
  background:color-mix(in srgb,var(--p) 10%,var(--card));
  color:var(--text);
  transform:translateX(3px);
}

.nav button:active{
  transform:scale(.96) translateX(2px);
}

.nav button.active{
  background:color-mix(in srgb,var(--p) 12%,var(--card));
  color:var(--text);
}

main{
  max-width:1250px;
  width:100%;
  margin:auto;
  padding:24px;
}

.title{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:end;
  margin-bottom:18px;
}

.title h1{
  margin:0;
  font-size:27px;
}

.title p{
  margin:5px 0 0;
  color:var(--muted);
}

.grid{
  display:grid;
  gap:14px;
}

.cols{
  grid-template-columns:1.4fr 1fr;
}

.stats{
  grid-template-columns:repeat(4,1fr);
}

.members{
  grid-template-columns:repeat(3,1fr);
}

/* =========================
   CARDS
========================= */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:17px;
}

.stat b{
  display:block;
  font-size:28px;
  margin-top:4px;
}

.muted{
  color:var(--muted);
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  padding:9px 12px;
  border-radius:10px;
  font-weight:750;
  min-height:40px;
}

.btn.primary{
  background:var(--p);
  color:#fff;
  border-color:var(--p);
}

.btn.danger{
  background:var(--danger);
  color:#fff;
  border-color:var(--danger);
}

.btn.primary:hover{
  box-shadow:0 7px 18px color-mix(in srgb,var(--p) 30%,transparent);
}

/* =========================
   LIST
========================= */

.list{
  display:grid;
  gap:8px;
}

.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px;
}

.item:hover{
  transform:translateX(2px);
  border-color:color-mix(in srgb,var(--p) 35%,var(--line));
}

.badge{
  display:inline-block;
  border-radius:999px;
  padding:4px 8px;
  font-size:11px;
  font-weight:800;
  background:#dbeafe;
  color:#1d4ed8;
}

.badge.ok{
  background:#dcfce7;
  color:#166534;
}

.badge.bad{
  background:#fee2e2;
  color:#991b1b;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
}

/* =========================
   AVATAR
========================= */

.avatar{
  width:42px!important;
  height:42px!important;
  min-width:42px!important;
  max-width:42px!important;
  min-height:42px!important;
  max-height:42px!important;
  flex:0 0 42px!important;
  border-radius:50%;
  overflow:hidden;
  background:#dbeafe;
  display:grid;
  place-items:center;
  font-weight:800;
}

.avatar:hover{
  transform:scale(1.05);
}

.avatar img{
  display:block!important;
  width:42px!important;
  height:42px!important;
  min-width:42px!important;
  max-width:42px!important;
  min-height:42px!important;
  max-height:42px!important;
  border:0!important;
  margin:0!important;
  padding:0!important;
  border-radius:50%!important;
  object-fit:cover!important;
  object-position:center!important;
}

.avatar.big{
  width:76px!important;
  height:76px!important;
  min-width:76px!important;
  max-width:76px!important;
  min-height:76px!important;
  max-height:76px!important;
  flex:0 0 76px!important;
}

.avatar.big img{
  width:76px!important;
  height:76px!important;
  min-width:76px!important;
  max-width:76px!important;
  min-height:76px!important;
  max-height:76px!important;
}

.member{
  display:flex;
  gap:10px;
  align-items:center;
}

/* =========================
   FORM
========================= */

.field{
  display:grid;
  gap:5px;
}

.field label{
  font-size:13px;
  font-weight:700;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--card);
  color:var(--text);
  outline:none;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--p);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 15%,transparent);
  transform:translateY(-1px);
}

.form{
  display:grid;
  gap:12px;
}

.form2{
  grid-template-columns:1fr 1fr;
}

.full{
  grid-column:1/-1;
}

/* =========================
   TABLE
========================= */

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  text-align:left;
  padding:10px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

/* =========================
   CHAT
========================= */

.chat{
  min-height:500px;
  display:grid;
  grid-template-rows:1fr auto;
}

.messages{
  overflow:auto;
  display:grid;
  align-content:start;
  gap:8px;
}

.bubble{
  max-width:75%;
  background:color-mix(in srgb,var(--p) 10%,var(--card));
  padding:9px 11px;
  border-radius:14px;
  animation:cardIn .2s ease both;
}

.bubble.mine{
  margin-left:auto;
  background:var(--p);
  color:#fff;
}

.chatform{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.chatform input{
  flex:1;
}

/* =========================
   AUTH
========================= */

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:18px;
}

.authbox{
  width:min(430px,100%);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:25px;
  box-shadow:var(--shadow);
  animation:cardIn .35s ease both;
}

.tabs{
  display:flex;
  gap:6px;
  margin:16px 0;
}

.tabs button{
  flex:1;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:grid;
  place-items:center;
  padding:18px;
  z-index:50;
}

.modalbox{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border-radius:18px;
  padding:18px;
  animation:modalIn .22s cubic-bezier(.2,.8,.2,1) both;
  box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modalhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modalhead h2{
  margin:0;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:15px;
  bottom:15px;
  background:var(--text);
  color:var(--card);
  padding:11px 14px;
  border-radius:11px;
  z-index:100;
  animation:toastIn .2s ease both;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

/* =========================
   COLORS
========================= */

.colors{
  display:flex;
  gap:9px;
}

.color{
  width:48px;
  height:36px;
  border-radius:10px;
  border:3px solid var(--line);
  cursor:pointer;
}

.color:hover{
  transform:translateY(-2px) scale(1.03);
}

.color:active{
  transform:scale(.9);
}

.color.active{
  border-color:var(--p);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 15%,transparent);
}

.black{background:#111}
.gray{background:#64748b}
.white{background:#fff}
.blue{background:#2563eb}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){

  .layout{
    grid-template-columns:1fr;
  }

  aside{
    display:none;
  }

  main{
    padding:17px 13px 82px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .cols,
  .members{
    grid-template-columns:1fr;
  }

  .mobile{
    display:grid!important;
  }

  .top{
    padding:0 13px;
  }

  .brand span{
    display:none;
  }

  .title{
    align-items:start;
  }

  .title h1{
    font-size:24px;
  }

  .item{
    align-items:flex-start;
  }
}

.mobile{
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:62px;
  background:var(--card);
  border-top:1px solid var(--line);
  z-index:20;
  grid-template-columns:repeat(5,1fr);
}

.mobile button{
  border:0;
  background:none;
  color:var(--muted);
  font-size:11px;
}

.mobile button:hover{
  background:color-mix(in srgb,var(--p) 7%,var(--card));
}

.mobile .active{
  color:var(--p);
  font-weight:800;
}

/* =========================
   ROLE BUTTON
========================= */

.role-action{
  width:100%;
  margin-top:15px;
  min-height:46px;
  font-size:15px;
  font-weight:850;
}

.role-action:active{
  transform:scale(.94);
}

.role-save{
  width:100%;
  min-height:46px;
  font-size:15px;
  margin-top:4px;
}

/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }

}

    if(S.mode==="signup"){

      r=await sb.auth.signUp({

        email:$("email").value,

        password:$("password").value,

        options:{
          data:{
            display_name:
              $("name").value ||
              $("email").value.split("@")[0]
          }
        }

      });

    }else{

      r=await sb.auth.signInWithPassword({

        email:$("email").value,

        password:$("password").value

      });

    }

    if(r.error)
      throw r.error;


    if(r.data.session){

      await start(r.data.session.user);

    }else{

      toast(
        "สมัครแล้ว กรุณายืนยันอีเมลถ้าระบบร้องขอ"
      );

    }

  }catch(e){

    toast(e.message);

  }finally{

    authButton.disabled=false;

    authButton.textContent=originalText;

  }

};


/* =========================
   START
========================= */

async function start(user){

  S.user=user;

  const r=await sb
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .single();


  if(r.error){

    toast(r.error.message);

    return;

  }


  S.p=r.data;

  theme();


  $("auth").classList.add("hidden");

  $("app").classList.remove("hidden");


  await loadAll();

}


/* =========================
   LOAD ALL
========================= */

async function loadAll(){

  if(!S.p)
    return;


  try{

    const q=await Promise.all([

      sb
        .from("profiles")
        .select("*")
        .eq("room_id",S.p.room_id)
        .order("number"),


      sb
        .from("tasks")
        .select(
          "*,assigned:profiles!tasks_assigned_to_fkey(display_name,number)"
        )
        .eq("room_id",S.p.room_id)
        .order("due_date"),


      sb
        .from("reports")
        .select(
          "*,target:profiles!reports_target_id_fkey(display_name),reporter:profiles!reports_reporter_id_fkey(display_name)"
        )
        .eq("room_id",S.p.room_id)
        .order("created_at",{ascending:false})
        .limit(100),


      sb
        .from("payments")
        .select(
          "*,member:profiles!payments_member_id_fkey(display_name)"
        )
        .eq("room_id",S.p.room_id)
        .order("week_start",{ascending:false})
        .limit(200),


      sb
        .from("messages")
        .select(
          "*,sender:profiles!messages_sender_id_fkey(display_name,avatar_url)"
        )
        .eq("room_id",S.p.room_id)
        .order("created_at")
        .limit(300)

    ]);


    if(q.some(x=>x.error))
      throw q.find(x=>x.error).error;


    [
      S.members,
      S.tasks,
      S.reports,
      S.payments,
      S.messages
    ]=q.map(x=>x.data||[]);


    render();


  }catch(e){

    toast(
      "โหลดข้อมูลไม่สำเร็จ: "+
      e.message
    );

  }

}

modal(

"แก้ไขโปรไฟล์",

`

  <form
    id="f"
    class="form">

    <div class="field">

      <label>ชื่อ</label>

      <input
        id="n"
        value="${esc(S.p.display_name)}"
        required>

    </div>


    <div class="field">

      <label>นามสกุล</label>

      <input
        id="l"
        value="${esc(S.p.last_name||"")}">

    </div>


    <div class="field">

      <label>เลขที่</label>

      <input
        id="num"
        value="${esc(S.p.number||"")}"
        inputmode="numeric">

    </div>


    <div class="field">

      <label>
        รูปโปรไฟล์จากแกลเลอรี
      </label>

      <input
        id="photo"
        type="file"
        accept="image/*">

    </div>


    <div
      id="preview"
      class="muted">

      เลือกรูปแล้วกดบันทึก

    </div>


    <button class="btn primary">
      บันทึก
    </button>

  </form>

`

);

$("f").onsubmit=async e=>{

e.preventDefault();

const btn=e.submitter;

btn.disabled=true;

btn.textContent="กำลังบันทึก...";


try{

  let url=S.p.avatar_url;

  const file=$("photo").files[0];


  if(file){

    const safeName=
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        ""
      );


    const path=
      `${S.user.id}/${Date.now()}-${safeName}`;


    const up=await sb
      .storage
      .from("avatars")
      .upload(
        path,
        file,
        {upsert:true}
      );


    if(up.error)
      throw up.error;


    url=
      sb
        .storage
        .from("avatars")
        .getPublicUrl(path)
        .data
        .publicUrl;

  }


  const r=await sb
    .from("profiles")
    .update({

      display_name:$("n").value,

      last_name:$("l").value,

      number:$("num").value,

      avatar_url:url

    })
    .eq("id",S.user.id)
    .select()
    .single();


  if(r.error)
    throw r.error;


  S.p=r.data;

  closeModal();

  render();


}catch(e){

  toast(e.message);

  btn.disabled=false;

  btn.textContent="บันทึก";

}

};

}

/* =========================
MEMBER PROFILE
========================= */

function member(id){

const p=
S.members.find(
x=>x.id===id
);

if(!p){

toast("❌ ไม่พบสมาชิก");

return;

}

const h=
S.reports.filter(
x=>x.target_id===id
);

modal(

"โปรไฟล์สมาชิก",

`

  <div class="member">

    ${avatar(p,true)}

    <div>

      <h2>
        ${esc(p.display_name)}
      </h2>

      <div class="muted">

        เลขที่
        ${esc(p.number||"-")}

        •

        ${esc(
          roles[p.role]||
          p.role||
          "-"
        )}

      </div>

    </div>

  </div>


  <hr
    style="
      border:0;
      border-top:1px solid var(--line);
      margin:15px 0
    ">


  <h3>
    ประวัติการถูกรายงาน
    (${h.length})
  </h3>


  ${reportsList(h)}


  ${
    S.p?.role==="owner" &&
    p.id!==S.user.id

    ?

    `
      <button
        id="openRoleButton"
        type="button"
        class="btn primary role-action">

        👑 เปลี่ยนยศ

      </button>
    `

    :

    ""
  }

`

);

/*

* ใช้ event listener แทน
* inline onclick
  */

const roleButton=
$("openRoleButton");

if(roleButton){

roleButton.addEventListener(
  "click",
  ()=>{
    role(id);
  }
);

}

}

/* =========================
ROLE MANAGER
========================= */

function role(id){

console.log(
"[Room Manager] Role button:",
id
);

if(S.p?.role!=="owner"){

toast(
  "❌ เฉพาะ Owner เท่านั้น"
);

return;

}

const p=
S.members.find(
x=>x.id===id
);

if(!p){

toast(
  "❌ ไม่พบสมาชิก"
);

return;

}

if(p.id===S.user.id){

toast(
  "❌ ไม่สามารถเปลี่ยนยศตัวเองได้"
);

return;

}

modal(

"เปลี่ยนยศ",

`

  <form
    id="roleForm"
    class="form">


    <div class="field">

      <label>สมาชิก</label>

      <input
        value="${esc(p.display_name)}"
        disabled>

    </div>


    <div class="field">

      <label>ยศปัจจุบัน</label>

      <input
        value="${esc(
          roles[p.role]||
          p.role||
          "-"
        )}"
        disabled>

    </div>


    <div class="field">

      <label>ยศใหม่</label>

      <select id="roleSelect">

        ${
          Object.entries(roles)
          .map(([k,v])=>`

            <option
              value="${k}"
              ${p.role===k?"selected":""}>

              ${v}

            </option>

          `)
          .join("")
        }

      </select>

    </div>


    <button
      id="roleSaveBtn"
      type="submit"
      class="btn primary role-save">

      💾 บันทึกยศ

    </button>


  </form>

`

);

const form=
$("roleForm");

if(!form){

toast(
  "❌ เปิดระบบเปลี่ยนยศไม่สำเร็จ"
);

return;

}

form.addEventListener(
"submit",
async e=>{

  e.preventDefault();


  const newRole=
    $("roleSelect").value;


  const btn=
    $("roleSaveBtn");


  if(newRole===p.role){

    toast(
      "ยศยังเหมือนเดิม"
    );

    return;

  }


  btn.disabled=true;

  btn.textContent=
    "⏳ กำลังบันทึก...";


  try{

    /*
     * เรียก Database Function
     *
     * change_member_role(
     *   target_user_id,
     *   new_role
     * )
     */

    const {
      data,
      error
    }=
      await sb.rpc(
        "change_member_role",
        {
          target_user_id:p.id,
          new_role:newRole
        }
      );


    console.log(
      "[Room Manager] RPC:",
      data,
      error
    );


    if(error)
      throw error;


    if(data!==true){

      throw new Error(
        "ฐานข้อมูลไม่ได้ยืนยันการเปลี่ยนยศ"
      );

    }


    /*
     * ปิด modal
     */

    closeModal();


    /*
     * แจ้งสำเร็จ
     */

    toast(
      `✅ เปลี่ยน ${p.display_name} → ${roles[newRole]} สำเร็จ`
    );


    /*
     * โหลดข้อมูลใหม่
     */

    await loadAll();


  }catch(err){

    console.error(
      "[Room Manager] Role error:",
      err
    );


    toast(
      "❌ เปลี่ยนยศไม่สำเร็จ: "+
      (
        err.message||
        "Unknown error"
      )
    );


    btn.disabled=false;

    btn.textContent=
      "💾 บันทึกยศ";

  }

}

);

}

/* =========================
CHAT
========================= */

async function sendMessage(e){

e.preventDefault();

const v=
$("chatInput")
.value
.trim();

if(!v)
return;

const btn=e.submitter;

btn.disabled=true;

btn.textContent="กำลังส่ง...";

const r=await sb
.from("messages")
.insert({

  room_id:S.p.room_id,

  sender_id:S.user.id,

  body:v

});

if(r.error){

toast(r.error.message);

btn.disabled=false;

btn.textContent="ส่ง";

}else{

$("chatInput").value="";

await loadAll();

}

}
