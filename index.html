<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d14">
<title>Room Manager • ห้อง 1/2</title>
<link rel="stylesheet" href="./base.css">
</head>
<body>
<div id="auth" class="auth-screen">
<section class="auth-card">
<div class="brand brand-large"><span class="logo">1/2</span><div><b>Room Manager</b><small>ระบบจัดการห้อง</small></div></div>
<div class="auth-heading"><span class="eyebrow">ROOM 1/2</span><h1 id="authTitle">เข้าสู่ระบบ</h1><p class="muted">งานเวร • รายงาน • เงินห้อง • รายชื่อ • แชท</p></div>
<div class="tabs"><button class="btn tab primary" id="loginTab">เข้าสู่ระบบ</button><button class="btn tab" id="signupTab">สมัครสมาชิก</button></div>
<form id="authForm" class="form">
<div id="nameField" class="field hidden"><label for="name">ชื่อที่แสดง</label><input id="name" autocomplete="name"></div>
<div class="field"><label for="email">อีเมล</label><input id="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">รหัสผ่าน</label><input id="password" type="password" minlength="6" autocomplete="current-password" required></div>
<button class="btn primary btn-block" id="authBtn">เข้าสู่ระบบ</button>
</form>
<p id="setupNote" class="muted setup-note"></p>
</section>
</div>

<div id="app" class="app hidden">
<header class="topbar">
<button class="mobile-menu btn icon-btn" onclick="toggleSidebar()" aria-label="เมนู">☰</button>
<div class="brand"><span class="logo">1/2</span><div><b>Room Manager</b><small>ห้อง 1/2</small></div></div>
<div class="top-actions"><button class="btn icon-btn" onclick="loadAll()" aria-label="รีเฟรช">↻</button><button class="user-chip" onclick="go('profile')" id="me"></button></div>
</header>
<div id="sidebarBackdrop" class="sidebar-backdrop hidden" onclick="toggleSidebar(false)"></div>
<div class="app-layout">
<aside id="sidebar" class="sidebar"><div class="sidebar-title">เมนูหลัก</div><div id="nav" class="nav"></div><div class="sidebar-footer"><span class="status-dot"></span> เชื่อมต่อระบบแล้ว</div></aside>
<main id="main" class="main"></main>
</div>
<nav id="mobileNav" class="mobile-nav"></nav>
</div>

<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="mt"></h2><button class="btn icon-btn" onclick="closeModal()" aria-label="ปิด">×</button></div><div id="mb" class="modalbody"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"><\/script>')}</script>
<script src="./state.js"></script>
<script src="./auth.js"></script>
<script src="./navigation.js"></script>
<script src="./pages.js"></script>
<script src="./tasks.js"></script>
<script src="./profile.js"></script>
<script src="./chat.js"></script>
<script src="./app.js"></script>
</body>
</html>
